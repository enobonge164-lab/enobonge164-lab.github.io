<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAPTIVATE AI — Business OS</title><style>
:root{--bg:#080b12;--panel:#111827;--panel2:#151e2e;--border:#263246;--text:#eef2ff;--muted:#9ba9bd;--purple:#8b5cf6;--purple2:#a78bfa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:#0d111a;border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:14px}.brand{font-weight:800;font-size:19px}.brand span{color:var(--purple2)}.tag,.navlabel{font-size:10px;color:var(--muted);letter-spacing:1.4px}.navlabel{font-weight:700;margin:10px}.nav button{display:flex;width:100%;border:0;background:transparent;color:#aab7cb;padding:11px;border-radius:10px;text-align:left;gap:10px}.nav button.active,.nav button:hover{background:#21163a;color:#e8d9ff}.sidefoot{margin-top:auto;color:#75849b;font-size:12px;border-top:1px solid var(--border);padding-top:15px}main{min-width:0;padding:28px clamp(14px,3vw,36px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.eyebrow{color:var(--purple2);font-weight:700;font-size:11px;letter-spacing:1.4px}.title{font-size:clamp(23px,3vw,32px);margin:3px 0}.sub,.kpi,.kpi-foot{color:var(--muted)}.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px 13px}.btn.primary{background:var(--purple);border-color:var(--purple);color:white}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:linear-gradient(145deg,var(--panel),#101722);border:1px solid var(--border);border-radius:14px;padding:16px}.kpi{font-size:12px}.metric{font-size:28px;font-weight:750;margin:7px 0}.kpi-foot{font-size:11px}.section{margin-top:22px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.sectionhead h2{margin:0;font-size:17px}.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px;border-bottom:1px solid #202c3e}th{font-size:11px;color:#91a1b8;text-transform:uppercase}tr:last-child td{border:0}.pill{display:inline-block;border-radius:99px;padding:3px 9px;background:#242f42;font-size:11px}.pill.lead{background:#2a2144;color:#d8c4ff}.pill.customer{background:#123526;color:#a7f3c1}.empty{padding:28px;text-align:center;color:var(--muted)}.search{background:#0c121b;border:1px solid var(--border);border-radius:9px;padding:9px;color:var(--text)}.quick,.modulegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.modulegrid{grid-template-columns:repeat(2,1fr)}.quickitem{border:1px solid var(--border);border-radius:12px;padding:15px;background:var(--panel2)}.quickitem strong{display:block}.quickitem span{font-size:12px;color:var(--muted)}.modalback{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.modalback.show{display:flex}.modal{width:min(560px,100%);background:#101722;border:1px solid var(--border);border-radius:16px;padding:20px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 15px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;background:#090e16;border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text)}.field textarea{min-height:75px}.full{grid-column:1/-1}.formactions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.toast{position:fixed;bottom:20px;right:20px;background:#1d2a3d;border:1px solid var(--border);padding:12px 16px;border-radius:10px;display:none}.toast.show{display:block}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{padding:13px;border-right:0;border-bottom:1px solid var(--border)}.nav{display:flex;overflow:auto;gap:3px}.nav button{white-space:nowrap;width:auto;padding:9px}.navlabel,.sidefoot{display:none}main{padding:19px 13px}.top{align-items:flex-start}.grid{gap:9px}.card{padding:12px}.metric{font-size:24px}.quick,.modulegrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.sectionhead{align-items:flex-start;flex-direction:column}.search{width:100%}}
</style></head><body><div class="app"><aside class="sidebar"><div><div class="brand">CAPTIVATE <span>AI</span></div><div class="tag">BUSINESS OS</div></div><div class="navlabel">WORKSPACE</div><nav class="nav" id="nav"><button class="active" data-page="overview">▦ Overview</button><button data-page="crm">♙ AI CRM</button><button data-page="sales">↗ Sales Manager</button><button data-page="support">◉ Customer Support</button><button data-page="whatsapp">◌ WhatsApp AI</button><button data-page="analytics">▤ Analytics</button><button data-page="automation">⌘ Automation Center</button></nav><div class="sidefoot">Foundation v1 · Browser-local storage</div></aside><main><header class="top"><div><div class="eyebrow">BUSINESS OPERATIONS</div><h1 class="title" id="pageTitle">Business Overview</h1><div class="sub" id="pageSub">Your business workspace at a glance.</div></div><button class="btn primary" id="addBtn">＋ Add Contact</button></header><div id="content"></div></main></div>
<div class="modalback" id="modal"><div class="modal"><h2 id="modalTitle">Add Contact</h2><form id="contactForm"><div class="formgrid"><div class="field"><label>Name *</label><input name="name" required maxlength="120"></div><div class="field"><label>Company</label><input name="company" maxlength="120"></div><div class="field"><label>Email</label><input name="email" type="email" maxlength="160"></div><div class="field"><label>Phone</label><input name="phone" maxlength="40"></div><div class="field"><label>Record type</label><select name="type"><option>Lead</option><option>Customer</option></select></div><div class="field"><label>Lead source</label><select name="source"><option>Not specified</option><option>Website</option><option>Referral</option><option>Social media</option><option>WhatsApp</option><option>Walk-in</option><option>Other</option></select></div><div class="field full"><label>Notes</label><textarea name="notes" maxlength="2000" placeholder="Customer needs, conversation notes, context…"></textarea></div></div><div class="formactions"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn primary">Save Contact</button></div></form></div></div><div class="toast" id="toast"></div>
<script>(()=>{'use strict';const DB='captivate-business-os',STORE='contacts', $=id=>document.getElementById(id);let db,records=[],page='overview',query='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}function all(){return new Promise((ok,no)=>{let r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error);});}function save(v){return new Promise((ok,no)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(v);r.onsuccess=()=>ok();r.onerror=()=>no(r.error);});}function del(id){return new Promise((ok,no)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>ok();r.onerror=()=>no(r.error);});}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200);}function date(t){return new Date(t).toLocaleDateString();}function table(list){if(!list.length)return '<div class="empty">No records yet. Add your first contact.</div>';return `<div class="tablewrap"><table><thead><tr><th>Name</th><th>Company</th><th>Type</th><th>Contact</th><th>Added</th><th>Actions</th></tr></thead><tbody>${list.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.company||'—')}</td><td><span class="pill ${c.type.toLowerCase()}">${esc(c.type)}</span></td><td>${esc(c.email||c.phone||'—')}</td><td>${date(c.created)}</td><td><button class="btn" data-edit="${esc(c.id)}">Edit</button> <button class="btn" data-del="${esc(c.id)}">Delete</button></td></tr>`).join('')}</tbody></table></div>`;}function exportCSV(){let rows=[['Name','Company','Email','Phone','Type','Source','Notes','Created'],...records.map(c=>[c.name,c.company,c.email,c.phone,c.type,c.source,c.notes,date(c.created)])];let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='captivate-crm-contacts.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('CSV exported');}function render(){let leads=records.filter(x=>x.type==='Lead').length,customers=records.filter(x=>x.type==='Customer').length;$('addBtn').style.display=page==='overview'||page==='crm'?'':'none';if(page==='overview'){$('pageTitle').textContent='Business Overview';$('pageSub').textContent='Your connected business workspace at a glance.';$('content').innerHTML=`<div class="grid"><div class="card"><div class="kpi">Total contacts</div><div class="metric">${records.length}</div><div class="kpi-foot">All CRM records</div></div><div class="card"><div class="kpi">Leads</div><div class="metric">${leads}</div><div class="kpi-foot">Potential customers</div></div><div class="card"><div class="kpi">Customers</div><div class="metric">${customers}</div><div class="kpi-foot">Customer records</div></div><div class="card"><div class="kpi">Added this week</div><div class="metric">${records.filter(x=>Date.now()-x.created<604800000).length}</div><div class="kpi-foot">Last 7 days</div></div></div><section class="section"><div class="sectionhead"><h2>Quick actions</h2></div><div class="quick"><div class="quickitem" data-add><strong>＋ Add Contact</strong><span>Create a lead or customer</span></div><div class="quickitem" data-go="crm"><strong>♙ Open CRM</strong><span>Manage contacts and records</span></div><div class="quickitem" data-export><strong>⇩ Export CSV</strong><span>Download your contact backup</span></div></div></section><section class="section"><div class="sectionhead"><h2>Recent contacts</h2><button class="btn" data-go="crm">View all</button></div>${table([...records].sort((a,b)=>b.created-a.created).slice(0,5))}</section><section class="section"><div class="sectionhead"><h2>Business OS modules</h2></div><div class="modulegrid">${modules()}</div></section>`;}else if(page==='crm'){$('pageTitle').textContent='AI CRM';$('pageSub').textContent='Manage contacts, leads, customers and relationship notes.';let f=records.filter(c=>[c.name,c.company,c.email,c.phone,c.type,c.notes].join(' ').toLowerCase().includes(query));$('content').innerHTML=`<section class="section"><div class="sectionhead"><h2>Contacts <span class="pill">${f.length}</span></h2><div class="row"><input class="search" id="search" placeholder="Search contacts…" value="${esc(query)}"><button class="btn" data-export>Export CSV</button></div></div>${table(f)}</section>`;}else{let info={sales:['AI Sales Manager','Sales pipeline, opportunity tracking, proposals and sales assistance.'],support:['AI Customer Support','Customer enquiries, tickets, response drafts and resolution tracking.'],whatsapp:['WhatsApp Business AI','Messaging integration, AI replies, lead capture and follow-up workflows.'],analytics:['AI Business Analytics','Business performance, revenue trends, conversion metrics and reporting.'],automation:['AI Automation Center','Workflow triggers, scheduled tasks, connected actions and execution history.']}[page];$('pageTitle').textContent=info[0];$('pageSub').textContent=info[1];$('content').innerHTML=`<div class="card"><div class="eyebrow">MODULE FOUNDATION</div><h2>${info[0]}</h2><p class="sub">${info[1]}</p><p>This module is planned to connect to shared CRM records and services. Its build is scheduled after the CRM foundation.</p><div class="row"><span class="pill">Scaffolded</span><span class="pill">Shared CRM data</span><span class="pill">Planned module</span></div></div><section class="section"><h2>Shared records</h2><div class="grid"><div class="card"><div class="kpi">Contacts</div><div class="metric">${records.length}</div></div><div class="card"><div class="kpi">Leads</div><div class="metric">${leads}</div></div><div class="card"><div class="kpi">Customers</div><div class="metric">${customers}</div></div><div class="card"><div class="kpi">Storage</div><div class="metric" style="font-size:18px">IndexedDB</div></div></div></section>`;}}function modules(){return [['AI Sales Manager','Pipeline and deals'],['AI Customer Support','Tickets and enquiries'],['WhatsApp Business AI','Messaging and follow-up'],['AI Business Analytics','Reports and insights'],['AI Automation Center','Workflow automation']].map(x=>`<div class="quickitem"><strong>${x[0]}</strong><span>${x[1]}</span><div style="margin-top:8px"><span class="pill">Next modules</span></div></div>`).join('');}function form(rec){$('modal').classList.add('show');$('modalTitle').textContent=rec?'Edit Contact':'Add Contact';let f=$('contactForm');f.reset();delete f.dataset.edit;if(rec){Object.keys(rec).forEach(k=>{if(f.elements[k])f.elements[k].value=rec[k]||''});f.dataset.edit=rec.id;}}function close(){ $('modal').classList.remove('show');} $('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;query='';document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render();};$('content').onclick=async e=>{let b=e.target.closest('[data-add],[data-go],[data-export],[data-edit],[data-del]');if(!b)return;if(b.hasAttribute('data-add'))form();if(b.dataset.go){page=b.dataset.go;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render();}if(b.hasAttribute('data-export'))exportCSV();if(b.dataset.edit){let r=records.find(x=>x.id===b.dataset.edit);if(r)form(r);}if(b.dataset.del&&confirm('Delete this contact?')){await del(b.dataset.del);records=await all();render();toast('Contact deleted');};};$('content').oninput=e=>{if(e.target.id==='search'){query=e.target.value.toLowerCase();let pos=e.target.selectionStart;render();let inp=$('search');if(inp){inp.focus();inp.setSelectionRange(pos,pos);}}};$('addBtn').onclick=()=>form();$('cancel').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close();};$('contactForm').onsubmit=async e=>{e.preventDefault();let f=e.target,d=Object.fromEntries(new FormData(f)),id=f.dataset.edit||crypto.randomUUID(),old=records.find(x=>x.id===id);let rec={id,...d,created:old?.created||Date.now(),updated:Date.now()};await save(rec);records=await all();close();render();toast(old?'Contact updated':'Contact saved');};(async()=>{try{db=await openDB();records=await all();render();}catch(err){$('content').innerHTML=`<div class="card"><h2>Local storage unavailable</h2><p>${esc(err.message)}</p>Use a current browser and open this page on HTTPS for IndexedDB.</div>`;}})();})();</script></body></html>
