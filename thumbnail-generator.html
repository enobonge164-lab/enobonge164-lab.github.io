
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAPTIVATE AI — Thumbnail Generator</title>
<style>
:root{--bg:#080b12;--panel:#111827;--panel2:#0d111a;--border:#263044;--text:#f8fafc;--muted:#94a3b8;--primary:#8b5cf6;--primary2:#a78bfa;--danger:#ef4444;--success:#22c55e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:24px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--primary),#4c1d95);display:grid;place-items:center;font-weight:900}
.brand h1{font-size:22px;margin:0}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 10px 30px #0003}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
input,select,textarea{width:100%;border:1px solid var(--border);background:#0a0f18;color:var(--text);border-radius:11px;padding:12px;font:inherit}
textarea{min-height:105px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none}
button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer;color:white;background:var(--primary)}
button:hover{filter:brightness(1.08)}
button.secondary{background:#20283a}
button:disabled{opacity:.55;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.status{display:none;margin-top:14px;padding:12px;border-radius:10px;background:#0b1320;color:var(--muted);border:1px solid var(--border);overflow-wrap:anywhere}
.status.show{display:block}
.status.success{border-color:#14532d;color:#bbf7d0}
.status.error{border-color:#7f1d1d;color:#fecaca}
.result{display:none}
.result.show{display:block}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.preview{background:#070a10;border:1px solid var(--border);border-radius:14px;overflow:hidden;min-height:180px;display:grid;place-items:center}
.preview img{display:block;width:100%;height:auto}
.empty{padding:30px;text-align:center;color:var(--muted)}
h2{margin:0 0 14px;font-size:18px}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#24154c;color:#ddd6fe;font-size:11px;font-weight:800;margin-bottom:10px}
.meta{color:var(--muted);font-size:13px;line-height:1.8;overflow-wrap:anywhere}
.json{white-space:pre-wrap;overflow-wrap:anywhere;background:#080b12;border:1px solid var(--border);border-radius:12px;padding:14px;max-height:360px;overflow:auto;font-size:12px;color:#cbd5e1}
@media(max-width:760px){.grid,.hero{grid-template-columns:1fr}.wrap{padding:14px}.card{padding:15px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">CA</div>
    <div>
      <h1>CAPTIVATE AI — Thumbnail Generator</h1>
      <p>Create attention-grabbing thumbnails with the existing Cloudflare image-generation engine.</p>
    </div>
  </div>

  <div class="card">
    <span class="pill">CONTENT STUDIO</span>
    <h2>Thumbnail Brief</h2>
    <div class="grid">
      <div><label for="title">Video Title / Topic *</label><input id="title" placeholder="e.g. 10 AI Tools That Can Change Your Business" required></div>
      <div><label for="platform">Platform</label>
        <select id="platform"><option>YouTube</option><option>TikTok</option><option>Facebook</option><option>Instagram</option><option>LinkedIn</option><option>Other</option></select>
      </div>
      <div><label for="style">Thumbnail Style</label>
        <select id="style"><option>High-CTR YouTube thumbnail</option><option>Professional business</option><option>Tech / futuristic</option><option>Gaming</option><option>Educational</option><option>News / commentary</option><option>Minimal premium</option><option>Cinematic</option></select>
      </div>
      <div><label for="mood">Mood</label>
        <select id="mood"><option>Bold and exciting</option><option>Professional</option><option>Curious / mysterious</option><option>Urgent</option><option>Luxury / premium</option><option>Energetic</option><option>Serious</option></select>
      </div>
      <div><label for="subject">Main Subject</label><input id="subject" placeholder="Person, product, laptop, AI robot, business scene..."></div>
      <div><label for="text">Thumbnail Text</label><input id="text" placeholder="Short text, e.g. 10 AI TOOLS"></div>
      <div><label for="aspect">Aspect Ratio</label>
        <select id="aspect"><option value="16:9">16:9 — YouTube</option><option value="1:1">1:1 — Square</option><option value="4:5">4:5 — Social</option><option value="9:16">9:16 — Vertical</option></select>
      </div>
      <div><label for="branding">Branding</label><input id="branding" value="CAPTIVATE AI — purple and white"></div>
      <div class="full"><label for="details">Additional Instructions</label><textarea id="details" placeholder="Describe composition, background, emotion, objects, visual emphasis, etc."></textarea></div>
    </div>
    <div class="actions">
      <button id="generate" type="button">Generate Thumbnail</button>
      <button class="secondary" id="clear" type="button">Clear</button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </div>

  <div id="result" class="card result">
    <div class="hero">
      <div>
        <span class="pill">GENERATED THUMBNAIL</span>
        <div id="preview" class="preview"><div class="empty">Your thumbnail will appear here.</div></div>
        <div class="actions">
          <button id="download" type="button">Download Image</button>
          <button class="secondary" id="open" type="button">Open Full Size</button>
          <button class="secondary" id="copy" type="button">Copy Image Data</button>
        </div>
      </div>
      <div>
        <h2>Generation Details</h2>
        <div id="meta" class="meta"></div>
      </div>
    </div>
    <div style="margin-top:20px"><h2>Prompt Used</h2><div id="prompt" class="json"></div></div>
    <div style="margin-top:20px"><h2>Raw Response</h2><div id="raw" class="json"></div></div>
  </div>
</div>

<script>
'use strict';

const API_URL = 'https://captivate-ai-api.sirwhitethepolymath.workers.dev';
const $ = id => document.getElementById(id);
let imageData = '';
let lastData = null;
let promptUsed = '';

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, character => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[character]));
}

function findImage(value) {
  if (typeof value === 'string') {
    const match = value.match(/data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=\s]+/);
    if (match) return match[0].replace(/\s/g, '');
    if (/^https?:\/\/\S+$/i.test(value)) return value;
    if (value.length > 200 && /^[A-Za-z0-9+/=\s]+$/.test(value)) {
      return 'data:image/jpeg;base64,' + value.replace(/\s/g, '');
    }
  }

  if (value && typeof value === 'object') {
    for (const item of Object.values(value)) {
      const result = findImage(item);
      if (result) return result;
    }
  }
  return '';
}

function showStatus(message, type = '') {
  const status = $('status');
  status.textContent = message;
  status.className = 'status show ' + type;
}

function buildPrompt() {
  const title = $('title').value.trim();
  const platform = $('platform').value;
  const style = $('style').value;
  const mood = $('mood').value;
  const subject = $('subject').value.trim();
  const thumbnailText = $('text').value.trim();
  const aspect = $('aspect').value;
  const branding = $('branding').value.trim();
  const details = $('details').value.trim();

  return [
    `Create a professional ${platform} thumbnail in ${aspect} aspect ratio.`,
    `Topic/video title: ${title}.`,
    `Thumbnail style: ${style}.`,
    `Mood: ${mood}.`,
    `Main subject: ${subject || 'a visually compelling subject relevant to the topic'}.`,
    `Thumbnail text: ${thumbnailText || 'Use minimal text if exact rendering is unreliable'}.`,
    `Branding: ${branding || 'none'}.`,
    `Additional instructions: ${details || 'Use a strong focal point, clear visual hierarchy, high contrast, cinematic lighting, clean composition and mobile-friendly readability.'}.`,
    'Make the design polished, modern and attention-grabbing.',
    'Avoid clutter, distorted faces, unreadable text, watermarks and unnecessary small details.',
    'Keep important subjects and text away from the edges.'
  ].join('\n');
}

async function generate() {
  const title = $('title').value.trim();

  if (!title) {
    showStatus('Please enter a video title or topic.', 'error');
    $('title').focus();
    return;
  }

  $('generate').disabled = true;
  $('result').classList.remove('show');
  showStatus('Generating thumbnail with CAPTIVATE AI...');

  promptUsed = buildPrompt();

  // Use the dedicated thumbnail handler, not image-generator.
  const payload = {
    type: 'thumbnail-generator',
    prompt: promptUsed,
    title,
    style: $('style').value,
    steps: 4
  };

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await response.json().catch(() => ({}));
    lastData = data;

    if (!response.ok || data.success === false || data.error) {
      throw new Error(data.error || data.message || `Request failed (${response.status}).`);
    }

    imageData = findImage(data.image || data);
    if (!imageData) {
      throw new Error('The server responded, but no image was found in the response. Check the Worker logs and returned data.');
    }

    $('preview').replaceChildren();
    const image = document.createElement('img');
    image.id = 'generated';
    image.alt = 'AI-generated thumbnail';
    image.src = imageData;
    image.onerror = () => showStatus('The response contained image data, but the browser could not display it.', 'error');
    $('preview').appendChild(image);

    $('meta').innerHTML =
      `<b>Status:</b> ${esc(data.state || 'Completed')}<br>` +
      `<b>Version:</b> ${esc(data.version || '—')}<br>` +
      `<b>Model:</b> ${esc(data.model || 'Cloudflare Workers AI')}<br>` +
      `<b>Provider:</b> ${esc(data.provider || 'Cloudflare Workers AI')}<br>` +
      `<b>Aspect requested:</b> ${esc($('aspect').value)}<br>` +
      `<b>Style:</b> ${esc($('style').value)}<br>` +
      `<b>Note:</b> The selected aspect ratio is included in the prompt; actual image dimensions depend on the image model.`;

    $('prompt').textContent = promptUsed;
    $('raw').textContent = JSON.stringify(data, null, 2);
    $('result').classList.add('show');
    showStatus('Thumbnail generated successfully.', 'success');
  } catch (error) {
    showStatus(error.message || 'Something went wrong while generating the thumbnail.', 'error');
  } finally {
    $('generate').disabled = false;
  }
}

$('generate').addEventListener('click', generate);

$('clear').addEventListener('click', () => {
  ['title', 'subject', 'text', 'details'].forEach(id => $(id).value = '');
  $('platform').selectedIndex = 0;
  $('style').selectedIndex = 0;
  $('mood').selectedIndex = 0;
  $('aspect').value = '16:9';
  $('branding').value = 'CAPTIVATE AI — purple and white';
  $('preview').innerHTML = '<div class="empty">Your thumbnail will appear here.</div>';
  $('meta').textContent = '';
  $('prompt').textContent = '';
  $('raw').textContent = '';
  $('result').classList.remove('show');
  $('status').className = 'status';
  $('status').textContent = '';
  imageData = '';
  lastData = null;
  promptUsed = '';
});

$('download').addEventListener('click', () => {
  if (!imageData) {
    showStatus('Generate a thumbnail before downloading.', 'error');
    return;
  }

  const link = document.createElement('a');
  link.href = imageData;
  link.download = 'captivate-ai-thumbnail.' + (imageData.startsWith('data:image/png') ? 'png' : 'jpg');
  document.body.appendChild(link);
  link.click();
  link.remove();
});

$('open').addEventListener('click', () => {
  if (imageData) window.open(imageData, '_blank', 'noopener');
});

$('copy').addEventListener('click', async () => {
  if (!imageData) {
    showStatus('Generate a thumbnail before copying image data.', 'error');
    return;
  }

  try {
    await navigator.clipboard.writeText(imageData);
    showStatus('Image data copied.', 'success');
  } catch {
    showStatus('Copy is blocked by this browser. Use Download Image instead.', 'error');
  }
});
</script>
</body>
</html>
