<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Bio Generator | Sirwhite The Polymath</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<a class="back" href="index.html">← Back to Portfolio</a>

<div class="card">

<h1>👤 AI Bio Generator</h1>

<p>Create professional bios for any social media platform.</p>

<select id="platform">
<option>Facebook</option>
<option>Instagram</option>
<option>LinkedIn</option>
<option>TikTok</option>
<option>YouTube</option>
<option>X (Twitter)</option>
</select>

<textarea
id="topic"
placeholder="Example: AI Creator">
</textarea>

<button onclick="generateBio()">
Generate Bio
</button>

<div id="result"></div>

<button onclick="copyBio()" class="btn">
📋 Copy Bio
</button>

</div>

</div>

<div id="toast" class="toast">
✅ Bio copied successfully!
</div>

<script>

async function generateBio(){

    const platform =
        document.getElementById("platform").value.trim();

    const topic =
        document.getElementById("topic").value.trim();

    if(topic === ""){
        alert("Please enter what you do.");
        return;
    }

    const result =
        document.getElementById("result");

    result.innerText =
        "⏳ Creating your professional bio...";

    try {

        const response = await fetch(
            "https://captivate-ai-api.sirwhitethepolymath.workers.dev",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },

                body: JSON.stringify({
                    type: "bio",
                    topic: topic,
                    platform: platform
                })
            }
        );

        const data = await response.json();

        if(!response.ok || !data.success){
            throw new Error(
                data.message ||
                data.error ||
                "AI generation failed."
            );
        }

        result.innerText =
            data.bio ||
            data.result ||
            "No bio was returned.";

    } catch(error){

        console.error(error);

        result.innerText =
            "❌ Error generating bio.\n\n" +
            (error.message || "Please try again.");
    }
}


function copyBio(){

    const result =
        document.getElementById("result").innerText;

    if(
        result.trim() === "" ||
        result.includes("Creating your professional bio")
    ){
        alert("Nothing to copy.");
        return;
    }

    navigator.clipboard.writeText(result);

    const toast =
        document.getElementById("toast");

    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);

}

</script>

</body>
</html>
