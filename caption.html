<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Caption Generator | Sirwhite The Polymath</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<a class="back" href="index.html">⬅ Back to Portfolio</a>

<div class="card">

<h1>AI Caption Generator</h1>

<p>Create engaging captions for your social media posts.</p>

<textarea
id="topic"
placeholder="Example: AI tools for beginners">
</textarea>
<select id="platform">
    <option value="Facebook">Facebook</option>
    <option value="Instagram">Instagram</option>
    <option value="LinkedIn">LinkedIn</option>
    <option value="X (Twitter)">X (Twitter)</option>
    <option value="TikTok">TikTok</option>
</select>
<button onclick="generateCaption()">
Generate Caption
</button>

<div id="result"></div>

<button onclick="copyResult()" class="btn">
📋 Copy Caption
</button>

</div>

</div>

<script>
async function generateCaption() {
  const topic = document.getElementById("topic").value;

  if (!topic.trim()) {
    alert("Please enter a topic.");
    return;
  }

  document.getElementById("result").innerText = "Generating caption...";

  try {
    const response = await fetch("https://captivate-ai-api.sirwhitethepolymath.workers.dev/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        topic: topic
      })
    });

    const data = await response.json();

    document.getElementById("result").innerText =
      data.caption || data.message || JSON.stringify(data);

  } catch (err) {
    document.getElementById("result").innerText =
      "Error connecting to AI.";
  }
}

function copyResult() {

    const result = document.getElementById("result").innerText;

    if (result.trim() === "") {
        alert("Nothing to copy.");
        return;
    }

    navigator.clipboard.writeText(result);

    alert("✅ Caption copied successfully!");
}
</script>
   <div id="toast" class="toast">
✅ Caption copied successfully!
</div> 
</body>
</html>
