<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI YouTube Script Generator | Sirwhite The Polymath</title>

<link rel="stylesheet" href="style.css">

<style>

.generate-btn{
    width:100%;
    margin-top:12px;
}

.generate-btn:disabled{
    opacity:0.7;
    cursor:not-allowed;
}

#result{
    min-height:120px;
    margin-top:20px;
    white-space:pre-wrap;
    line-height:1.6;
}

</style>

</head>

<body>

<div class="container">

<a class="back" href="index.html">
⬅ Back to Captivate AI
</a>

<div class="card">

<h1>🎬 AI YouTube Script Generator</h1>

<p>
Create engaging YouTube video scripts instantly.
</p>

<textarea
id="topic"
placeholder="Example: How to Make Money with AI">
</textarea>

<button
id="generateBtn"
class="generate-btn"
onclick="generateScript()">

Generate Script

</button>

<div id="result"></div>

<button
onclick="copyScript()"
class="btn">

📋 Copy Script

</button>

</div>

</div>

<div id="toast" class="toast">
✅ Script copied successfully!
</div>


<script>

async function generateScript(){

    const topic =
        document.getElementById("topic").value.trim();

    const resultBox =
        document.getElementById("result");

    const button =
        document.getElementById("generateBtn");


    /* Check topic */

    if(!topic){

        alert("Please enter a topic.");

        return;

    }


    /* Loading state */

    button.disabled = true;

    button.innerText =
        "⏳ Generating...";

    resultBox.innerText =
        "🤖 Captivate AI is creating your YouTube script...";


    try{

        const response = await fetch(

            "https://captivate-ai-api.sirwhitethepolymath.workers.dev/",

            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json",

                    "Accept":"*/*"

                },

                body:JSON.stringify({

                    type:"script",

                    topic:topic,

                    platform:"YouTube"

                })

            }

        );


        /* Read server response */

        const data =
            await response.json();


        /* Check response */

        if(!response.ok){

            throw new Error(

                data.message ||
                data.error ||
                "AI generation failed."

            );

        }


        /* Get generated script */

        const script =
            data.script ||
            data.result ||
            "";


        if(!script){

            throw new Error(
                "No script was returned."
            );

        }


        /* Display script */

        resultBox.innerText =
            script;


    }catch(error){

        console.error(error);

        resultBox.innerText =

            "❌ Failed to generate your script.\n\n" +

            (error.message ||
            "Please try again.");

    }finally{

        /* Restore button */

        button.disabled = false;

        button.innerText =
            "Generate Script";

    }

}


/* Copy script */

function copyScript(){

    const result =
        document.getElementById("result").innerText;


    if(!result.trim()){

        alert("Nothing to copy.");

        return;

    }


    navigator.clipboard.writeText(result);


    const toast =
        document.getElementById("toast");


    if(toast){

        toast.classList.add("show");


        setTimeout(()=>{

            toast.classList.remove("show");

        },2500);

    }

}

</script>

</body>

</html>
