<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI YouTube Script Generator | Sirwhite The Polymath</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<a class="back" href="index.html">
← Back to Captivate AI
</a>

<div class="card">

<h1>🎬 AI YouTube Script Generator</h1>

<p>
Create engaging YouTube video scripts instantly.
</p>

<textarea
id="topic"
placeholder="Example: 5 ways AI can help small businesses">
</textarea>

<button
id="generateBtn"
onclick="generateScript()">

Generate Script

</button>

<div id="result"></div>

<button
onclick="copyScript()"
class="btn">

📋 Copy Script

</button>

</div>

</div>


<div id="toast" class="toast">
✅ Script copied successfully!
</div>


<script>

async function generateScript(){

    const topic =
        document.getElementById("topic").value.trim();

    const result =
        document.getElementById("result");

    const button =
        document.getElementById("generateBtn");


    if(topic === ""){

        alert("Please enter a topic.");

        return;

    }


    button.disabled = true;

    button.innerText =
        "⏳ Generating...";


    result.innerText =
        "🤖 Captivate AI is creating your script...";


    try{

        const response = await fetch(

            "https://captivate-ai-api.sirwhitethepolymath.workers.dev/",

            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json",

                    "Accept":
                    "application/json"

                },

                body:JSON.stringify({

                    type:"script",

                    platform:"YouTube",

                    topic: `

USER TOPIC:
${topic}

IMPORTANT REQUIREMENT:

If the user's topic requests a specific number of items,
you MUST provide exactly that number.

For example:

If the user asks for "5 ways",
provide EXACTLY 5 ways.

If the user asks for "7 tips",
provide EXACTLY 7 tips.

If the user asks for "10 mistakes",
provide EXACTLY 10 mistakes.

Never provide fewer items than requested.

The title, hook and script must all agree with
the requested number.

For numbered content, use this format:

1. First point
2. Second point
3. Third point
4. Fourth point
5. Fifth point

Do not stop before completing the requested number.

USER REQUEST:
${topic}

`

                })

            }

        );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(

                data.message ||
                data.error ||
                "AI generation failed."

            );

        }


        const script =

            data.script ||

            data.result ||

            data.output ||

            data.text ||

            "";


        if(!script){

            throw new Error(
                "No script was returned by the AI."
            );

        }


        const cleanScript =
            script

            .replace(/\\n/g,"\n")

            .replace(/^"+|"+$/g,"")

            .trim();


        result.innerText =
            cleanScript;


    }catch(error){

        console.error(error);

        result.innerText =

            "❌ Error generating script.\n\n" +

            (error.message ||
            "Please try again.");

    }finally{

        button.disabled = false;

        button.innerText =
            "Generate Script";

    }

}


function copyScript(){

    const text =
        document.getElementById("result").innerText;


    if(

        !text.trim() ||

        text.includes(
            "Captivate AI is creating"
        ) ||

        text.includes(
            "Error generating script"
        )

    ){

        alert("Generate a script first.");

        return;

    }


    navigator.clipboard.writeText(text)

    .then(()=>{

        const toast =
            document.getElementById("toast");


        toast.classList.add("show");


        setTimeout(()=>{

            toast.classList.remove("show");

        },2500);

    })

    .catch(()=>{

        alert(
            "Unable to copy automatically. Please select and copy the script."
        );

    });

}

</script>

</body>

</html>
