<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI YouTube Script Generator</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<a class="back" href="index.html">← Back to Portfolio</a>

<div class="card">

<h1>🎬 AI YouTube Script Generator</h1>

<p>Create engaging YouTube video scripts instantly.</p>

<textarea
id="topic"
placeholder="Example: How to Make Money with AI">
</textarea>

<button onclick="generateScript()">
Generate Script
</button>

<div id="result"></div>

<button onclick="copyScript()" class="btn">
📋 Copy Script
</button>

</div>

</div>

<div id="toast" class="toast">
✅ Script copied successfully!
</div>

<script>

async function generateScript(){

    const topic = document.getElementById("topic").value.trim();

    if(topic === ""){
        alert("Please enter a topic.");
        return;
    }

    const resultBox = document.getElementById("result");

    resultBox.innerText = "⏳ Creating your script...";

    try {

        const response = await fetch(
            "https://captivate-ai-api.sirwhitethepolymath.workers.dev/",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "*/*"
                },
                body: JSON.stringify({
                    type: "script",
                    topic: topic,
                    platform: "YouTube"
                })
            }
        );

        const data = await response.json();

        if(!response.ok || !data.success){
            throw new Error(
                data.message ||
                data.error ||
                "AI generation failed."
            );
        }

        resultBox.innerText =
            data.script ||
            data.result ||
            "No script was returned.";

    } catch(error) {

        console.error(error);

        resultBox.innerText =
            "❌ Failed to generate script.\n\n" +
            (error.message || "Please try again.");
    }
}
function copyScript(){

const result=document.getElementById("result").innerText;

if(result.trim()==""){
alert("Nothing to copy.");
return;
}

navigator.clipboard.writeText(result);

const toast=document.getElementById("toast");

toast.classList.add("show");

setTimeout(()=>{
toast.classList.remove("show");
},2500);

}

</script>

</body>
</html>
