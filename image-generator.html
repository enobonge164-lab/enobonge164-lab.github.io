<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Generator — CAPTIVATE AI</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
.image-result{margin-top:24px;display:none}.image-result.visible{display:block}
.image-result-card{background:rgba(17,24,39,.95);border:1px solid rgba(139,92,246,.35);border-radius:20px;padding:18px;overflow:hidden}
.image-result-title{font-size:18px;font-weight:700;margin-bottom:14px;color:#fff}
.generated-image-wrapper{width:100%;background:#080b12;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.generated-image{display:block;width:100%;height:auto;max-height:750px;object-fit:contain}
.image-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.image-action{border:1px solid rgba(139,92,246,.45);background:#111827;color:#fff;padding:11px 15px;border-radius:10px;cursor:pointer;font-weight:600;text-decoration:none;font-size:14px}
.image-action:hover{background:#8b5cf6}.image-meta{margin-top:14px;color:#aeb5c5;font-size:13px;line-height:1.7}
.image-prompt{margin-top:14px;padding:12px;background:#0d111a;border-radius:10px;color:#cbd5e1;font-size:13px;line-height:1.6}
.error-box{margin-top:16px;padding:14px;border-radius:10px;background:rgba(127,29,29,.2);border:1px solid rgba(239,68,68,.35);color:#fca5a5;display:none}
.loading-box{margin-top:18px;padding:14px;border-radius:10px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.25);color:#c4b5fd;display:none}
.loading-box.visible{display:block}.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.25);border-top-color:#a78bfa;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="app-shell"><section class="section">
<a class="back-link" href="captivate.html">← Back to CAPTIVATE AI</a>
<div class="section-header"><div><span class="coming-badge">CAPTIVATE AI</span><h1>AI Image Generator</h1><p>Turn your ideas into AI-generated images with CAPTIVATE AI.</p></div></div>
<div class="card tool-workspace">
<label for="request">Describe your image</label>
<textarea id="request" rows="8" placeholder="Describe what you want CAPTIVATE AI to create..."></textarea>
<div class="form-row"><label for="platform">Platform / format</label><input id="platform" placeholder="Optional — e.g. YouTube thumbnail, Instagram post, 16:9"></div>
<button id="run">Generate with CAPTIVATE AI</button>
<div id="loading" class="loading-box"><span class="spinner"></span>CAPTIVATE AI is creating your image...</div>
<p id="status" role="status"></p><div id="error" class="error-box"></div>
<div id="imageResult" class="image-result"><div class="image-result-card">
<div class="image-result-title">✨ Generated Image</div>
<div class="generated-image-wrapper"><img id="generatedImage" class="generated-image" alt="CAPTIVATE AI generated image"></div>
<div class="image-actions">
<a id="downloadButton" class="image-action" href="#" download="captivate-ai-image.jpg">⬇️ Download Image</a>
<button id="fullscreenButton" class="image-action" type="button">⛶ Fullscreen</button>
<button id="copyButton" class="image-action" type="button">📋 Copy Image</button>
<button id="regenerateButton" class="image-action" type="button">🔄 Generate Again</button>
</div>
<div id="imageMeta" class="image-meta"></div><div id="imagePrompt" class="image-prompt"></div>
</div></div>
</div></section></main>

<script>
const API='https://captivate-ai-api.sirwhitethepolymath.workers.dev';
const type='image-generator';

const requestInput=document.getElementById('request');
const platformInput=document.getElementById('platform');
const runButton=document.getElementById('run');
const status=document.getElementById('status');
const loading=document.getElementById('loading');
const errorBox=document.getElementById('error');
const imageResult=document.getElementById('imageResult');
const generatedImage=document.getElementById('generatedImage');
const downloadButton=document.getElementById('downloadButton');
const fullscreenButton=document.getElementById('fullscreenButton');
const copyButton=document.getElementById('copyButton');
const regenerateButton=document.getElementById('regenerateButton');
const imageMeta=document.getElementById('imageMeta');
const imagePrompt=document.getElementById('imagePrompt');

let currentImageData='';

function showLoading(){loading.classList.add('visible');errorBox.style.display='none';imageResult.classList.remove('visible');status.textContent=''}
function hideLoading(){loading.classList.remove('visible')}
function showError(message){hideLoading();errorBox.textContent='Error: '+message;errorBox.style.display='block';status.textContent=''}

function extractImageData(value){
  if(value===null||value===undefined||typeof value!=='string')return null;
  const text=value.trim();
  if(!text)return null;

  /*
   * Handles:
   * data.image = "data:image/jpeg;base64,..."
   * data.output = "Image: data:image/jpeg;base64,..."
   * data.result = "Image: data:image/jpeg;base64,..."
   */
  const match=text.match(/data:image\/(?:jpeg|jpg|png|webp|gif);(?:charset=[^;,]+;)?base64,[A-Za-z0-9+/=\s]+/i);
  if(match)return match[0].replace(/\s+/g,'');

  if(text.startsWith('/9j/'))return 'data:image/jpeg;base64,'+text.replace(/\s+/g,'');
  if(text.startsWith('iVBORw0KGgo'))return 'data:image/png;base64,'+text.replace(/\s+/g,'');
  if(text.startsWith('UklGR'))return 'data:image/webp;base64,'+text.replace(/\s+/g,'');

  return null;
}

function findImage(data,depth=0){
  if(!data||depth>7)return null;
  if(typeof data==='string')return extractImageData(data);
  if(typeof data!=='object')return null;

  const fields=['image','dataURI','dataUri','data_url','dataUrl','output','result','response'];

  for(const field of fields){
    if(Object.prototype.hasOwnProperty.call(data,field)){
      const found=findImage(data[field],depth+1);
      if(found)return found;
    }
  }

  for(const key of Object.keys(data)){
    if(fields.includes(key))continue;
    const value=data[key];
    if(typeof value==='string'){
      const found=extractImageData(value);
      if(found)return found;
    }else if(value&&typeof value==='object'){
      const found=findImage(value,depth+1);
      if(found)return found;
    }
  }
  return null;
}

function escapeHtml(value){
  return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

async function generateImage(){
  const request=requestInput.value.trim();
  const platform=platformInput.value.trim();

  if(!request){status.textContent='Please describe your image first.';return}

  showLoading();
  runButton.disabled=true;
  runButton.style.opacity='.6';
  runButton.textContent='Creating image...';

  try{
    const response=await fetch(API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type,topic:request,platform})
    });

    const data=await response.json();
    console.log('CAPTIVATE Image API response:',data);

    if(!response.ok||data.success===false){
      throw new Error(data.error||data.message||'Image generation failed.');
    }

    const image=findImage(data);

    if(!image){
      console.error('No usable image data found:',data);
      throw new Error('The image was generated, but no usable image data was found in the response.');
    }

    currentImageData=image;
    generatedImage.src=image;
    generatedImage.alt=request;
    downloadButton.href=image;

    const model=data.model||'@cf/black-forest-labs/flux-1-schnell';
    const steps=data.steps||4;
    const provider=data.provider||'cloudflare-workers-ai';

    imageMeta.innerHTML='<strong>Model:</strong> '+escapeHtml(model)+'<br><strong>Steps:</strong> '+escapeHtml(String(steps))+'<br><strong>Provider:</strong> '+escapeHtml(provider);
    imagePrompt.innerHTML='<strong>Prompt</strong><br>'+escapeHtml(request);

    generatedImage.onload=()=>{
      imageResult.classList.add('visible');
      hideLoading();
      status.textContent='Image generated successfully.';
      setTimeout(()=>imageResult.scrollIntoView({behavior:'smooth',block:'start'}),100);
    };

    generatedImage.onerror=()=>{
      hideLoading();
      imageResult.classList.remove('visible');
      showError('The image data was received, but the browser could not render it.');
    };

    if(generatedImage.complete&&generatedImage.naturalWidth>0)generatedImage.onload();

  }catch(error){
    console.error('CAPTIVATE Image Generator error:',error);
    showError(error.message||'Something went wrong while generating the image.');
  }finally{
    runButton.disabled=false;
    runButton.style.opacity='1';
    runButton.textContent='Generate with CAPTIVATE AI';
  }
}

fullscreenButton.addEventListener('click',async()=>{
  if(!currentImageData)return;
  try{
    if(generatedImage.requestFullscreen)await generatedImage.requestFullscreen();
    else window.open(currentImageData,'_blank');
  }catch(e){window.open(currentImageData,'_blank')}
});

copyButton.addEventListener('click',async()=>{
  if(!currentImageData)return;
  try{
    if(navigator.clipboard&&window.ClipboardItem){
      const blob=await fetch(currentImageData).then(r=>r.blob());
      await navigator.clipboard.write([new ClipboardItem({[blob.type]:blob})]);
      status.textContent='Image copied to clipboard.';
    }else{
      status.textContent='Image copying is not supported by this browser. Use Download Image.';
    }
  }catch(e){
    console.error(e);
    status.textContent='Copy is not supported here. Use Download Image instead.';
  }
});

regenerateButton.addEventListener('click',generateImage);
runButton.addEventListener('click',generateImage);

requestInput.addEventListener('keydown',event=>{
  if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){
    event.preventDefault();
    generateImage();
  }
});
</script>
</body>
</html>
