<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Business Proposal Generator</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f7fb;
max-width:900px;
margin:auto;
padding:40px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

h1{
color:#0b57d0;
}

select,input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
}

textarea{
height:120px;
}

button{
padding:12px 20px;
margin-top:10px;
background:#0b57d0;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#0845a6;
}

#result{
margin-top:20px;
padding:20px;
background:#eef3ff;
border-radius:10px;
white-space:pre-wrap;
}
</style>

</head>

<body>

<div class="card">

<h1>💼 AI Business Proposal Generator</h1>

<p>Create professional proposals in seconds.</p>

<select id="type">
<option>Business Proposal</option>
<option>Project Proposal</option>
<option>Partnership Proposal</option>
<option>Freelance Proposal</option>
<option>Investment Proposal</option>
<option>Sponsorship Proposal</option>
</select>

<input
id="client"
type="text"
placeholder="Client or Company Name">

<textarea
id="project"
placeholder="Describe the project or opportunity"></textarea>

<button onclick="generateProposal()">
Generate Proposal
</button>

<button onclick="copyProposal()">
Copy Proposal
</button>

<div id="result"></div>

</div>

<script>

async function generateProposal(){

    const type = document.getElementById("type").value.trim();
    const client = document.getElementById("client").value.trim();
    const project = document.getElementById("project").value.trim();

    if(client === "" || project === ""){
        alert("Please complete all fields.");
        return;
    }

    const result = document.getElementById("result");

    result.innerText = "⏳ Creating your professional proposal...";

    try {

        const response = await fetch(
            "https://captivate-ai-api.sirwhitethepolymath.workers.dev",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },

                body: JSON.stringify({
                    type: "proposal",
                    topic: `
Proposal Type: ${type}

Client or Company Name: ${client}

Project or Opportunity:
${project}
`
                })
            }
        );

        const data = await response.json();

        if(!response.ok || !data.success){
            throw new Error(
                data.message ||
                data.error ||
                "AI generation failed."
            );
        }

        result.innerText =
            data.proposal ||
            data.result ||
            "No proposal was returned.";

    } catch(error){

        console.error(error);

        result.innerText =
            "❌ Error generating proposal.\n\n" +
            (error.message || "Please try again.");
    }
}


function copyProposal(){

    const text =
        document.getElementById("result").innerText;

    if(
        text.trim() === "" ||
        text.includes("Creating your professional proposal")
    ){
        alert("Generate a proposal first.");
        return;
    }

    navigator.clipboard.writeText(text);

    alert("Proposal copied!");

}

</script>

</body>
</html>
