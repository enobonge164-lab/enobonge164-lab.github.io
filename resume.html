<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Resume Builder | Sirwhite The Polymath</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<div class="card">

<h1>📄 AI Resume Builder</h1>

<p>Create professional Resume summaries instantly.</p>

<textarea
id="job"
placeholder="Example: Security Guard">
</textarea>

<button onclick="generateResume()">
Generate Resume
</button>

<div id="result"></div>

<button onclick="copyResume()" class="btn">
Copy Resume
</button>

</div>

</div>

<div id="toast" class="toast">
✅ Resume copied successfully!
</div>

<script>

async function generateResume(){

    const job = document.getElementById("job").value.trim();

    if(job === ""){
        alert("Enter a Job Position.");
        return;
    }

    const result = document.getElementById("result");

    result.innerText = "⏳ Creating your professional resume...";

    try {

        const response = await fetch(
            "https://captivate-ai-api.sirwhitethepolymath.workers.dev",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },

                body: JSON.stringify({
                    type: "resume",
                    topic: `
Job Position:
${job}

Create professional resume content suitable for this position.
`
                })
            }
        );

        const data = await response.json();

        if(!response.ok || !data.success){
            throw new Error(
                data.message ||
                data.error ||
                "AI generation failed."
            );
        }

        result.innerText =
            data.resume ||
            data.result ||
            "No resume was returned.";

    } catch(error){

        console.error(error);

        result.innerText =
            "❌ Error generating resume.\n\n" +
            (error.message || "Please try again.");
    }
}


function copyResume(){

    const result =
        document.getElementById("result").innerText;

    if(
        result.trim() === "" ||
        result.includes("Creating your professional resume")
    ){
        alert("Nothing to copy.");
        return;
    }

    navigator.clipboard.writeText(result);

    const toast =
        document.getElementById("toast");

    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);

}

</script>

</body>
</html>
