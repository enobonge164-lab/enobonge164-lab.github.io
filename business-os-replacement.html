<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>CAPTIVATE AI — Business OS</title>
<style>
:root{--bg:#080b12;--side:#0d111a;--panel:#111827;--panel2:#151e2e;--border:#263246;--text:#eef2ff;--muted:#9ba9bd;--purple:#8b5cf6;--purple2:#a78bfa;--green:#22c55e;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}.sidebar{background:var(--side);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:14px}.brand{font-size:19px;font-weight:850}.brand span{color:var(--purple2)}.tag,.navlabel{font-size:10px;color:var(--muted);letter-spacing:1.4px}.navlabel{font-weight:700;margin:10px}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:#aab7cb;padding:11px;border-radius:10px;text-align:left}.nav button.active,.nav button:hover{background:#21163a;color:#e8d9ff}.sidefoot{margin-top:auto;color:#75849b;font-size:12px;border-top:1px solid var(--border);padding-top:15px}main{min-width:0;padding:28px clamp(14px,3vw,36px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.eyebrow{color:var(--purple2);font-weight:700;font-size:11px;letter-spacing:1.4px}.title{font-size:clamp(23px,3vw,32px);margin:3px 0}.sub,.kpi,.kpi-foot,.status{color:var(--muted)}.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px 13px}.btn:hover{border-color:var(--purple2)}.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}.btn.danger{color:#fecaca;border-color:#713333}.btn.small{padding:6px 9px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:linear-gradient(145deg,var(--panel),#101722);border:1px solid var(--border);border-radius:14px;padding:16px}.kpi{font-size:12px}.metric{font-size:28px;font-weight:750;margin:7px 0}.kpi-foot,.status{font-size:11px}.section{margin-top:22px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.sectionhead h2{margin:0;font-size:17px}.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:12px;border-bottom:1px solid #202c3e;vertical-align:middle}th{font-size:11px;color:#91a1b8;text-transform:uppercase;white-space:nowrap}tr:last-child td{border:0}.pill{display:inline-block;border-radius:99px;padding:3px 9px;background:#242f42;font-size:11px}.pill.lead{background:#2a2144;color:#d8c4ff}.pill.customer,.pill.won,.pill.completed{background:#123526;color:#a7f3c1}.pill.lost{background:#48232a;color:#fecaca}.empty{padding:28px;text-align:center;color:var(--muted)}.search{background:#0c121b;border:1px solid var(--border);border-radius:9px;padding:9px;color:var(--text);min-width:190px}.quick,.modulegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.modulegrid{grid-template-columns:repeat(2,1fr)}.quickitem{border:1px solid var(--border);border-radius:12px;padding:15px;background:var(--panel2);cursor:pointer}.quickitem strong{display:block}.quickitem span{font-size:12px;color:var(--muted)}.quickitem:hover{border-color:var(--purple2)}.tabs,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tabs{margin-bottom:14px}.tab{border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--muted);padding:8px 12px}.tab.active{background:#2a2144;color:#eadfff;border-color:#6242a0}.modalback{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.modalback.show{display:flex}.modal{width:min(620px,100%);background:#101722;border:1px solid var(--border);border-radius:16px;padding:20px;max-height:92vh;overflow:auto}.modal h2{margin:0 0 15px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;background:#090e16;border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text)}.field textarea{min-height:75px;resize:vertical}.full{grid-column:1/-1}.formactions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.toast{position:fixed;bottom:20px;right:20px;background:#1d2a3d;border:1px solid var(--border);padding:12px 16px;border-radius:10px;display:none;z-index:40;max-width:min(92vw,440px)}.toast.show{display:block}.ok{color:#86efac}.bad{color:#fca5a5}.module-card{cursor:default}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{padding:13px;border-right:0;border-bottom:1px solid var(--border)}.nav{display:flex;overflow:auto;gap:3px}.nav button{white-space:nowrap;padding:9px}.navlabel,.sidefoot{display:none}main{padding:19px 13px}.top{align-items:flex-start}.grid{gap:9px}.card{padding:12px}.metric{font-size:24px}.quick,.modulegrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.sectionhead{align-items:flex-start;flex-direction:column}.search{width:100%;min-width:0}.tablewrap table{min-width:680px}}
</style></head><body>
<div class="app"><aside class="sidebar"><div><div class="brand">CAPTIVATE <span>AI</span></div><div class="tag">BUSINESS OS</div></div><div class="navlabel">WORKSPACE</div><nav class="nav" id="nav"><button class="active" data-page="overview">▦ Overview</button><button data-page="crm">♙ AI CRM</button><button data-page="sales">↗ Sales Manager</button><button data-page="support">◉ Customer Support</button><button data-page="whatsapp">◌ WhatsApp AI</button><button data-page="analytics">▤ Analytics</button><button data-page="automation">⌘ Automation Center</button></nav><div class="sidefoot">Business OS · Cloudflare D1<br><span id="connectionStatus">Connecting…</span></div></aside>
<main><header class="top"><div><div class="eyebrow">BUSINESS OPERATIONS</div><h1 class="title" id="pageTitle">Business Overview</h1><div class="sub" id="pageSub">Your business workspace at a glance.</div></div><button class="btn primary" id="addBtn">＋ Add Contact</button></header><div id="content"><div class="card">Connecting to CAPTIVATE CRM…</div></div></main></div>
<div class="modalback" id="modal"><div class="modal"><h2 id="modalTitle">Add Contact</h2><form id="recordForm"><div id="formFields" class="formgrid"></div><div class="formactions"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn primary" id="saveButton">Save</button></div></form></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const DEFAULT_API='https://captivate-ai-api.sirwhitethepolymath.workers.dev';
const API=(localStorage.getItem('captivate_api_url')||DEFAULT_API).replace(/\/+$/,'');
const $=id=>document.getElementById(id);let page='overview',crmTab='contacts',query='',business=null,contacts=[],deals=[],activities=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(minor,currency='NGN')=>{try{return new Intl.NumberFormat('en-NG',{style:'currency',currency:currency||'NGN',maximumFractionDigits:2}).format((Number(minor)||0)/100)}catch(_){return (currency||'NGN')+' '+((Number(minor)||0)/100).toFixed(2)}};
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),3200)}
function status(s,ok){$('connectionStatus').textContent=s;$('connectionStatus').className=ok?'ok':'bad'}
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d;try{d=await r.json()}catch(_){throw Error('Worker returned an unreadable response ('+r.status+').')}if(!r.ok||d.success===false)throw Error(d.error||'Request failed ('+r.status+').');return d}
async function loadAll(){const d=await api('/crm/bootstrap');business=d.business;contacts=d.records.contacts||[];deals=d.records.deals||[];activities=d.records.activities||[];status('D1 connected · '+business.name,true);render()}
async function refresh(c){const d=await api('/crm/'+c);if(c==='contacts')contacts=d.records||[];if(c==='deals')deals=d.records||[];if(c==='activities')activities=d.records||[]}
function date(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleString()}
function pill(v){return '<span class="pill '+esc(String(v||'').toLowerCase().replace(/[^a-z]/g,''))+'">'+esc(v||'—')+'</span>'}
function contactName(id){return contacts.find(x=>x.id===id)?.name||'—'}function dealName(id){return deals.find(x=>x.id===id)?.title||'—'}
function empty(s){return '<div class="empty">'+esc(s)+'</div>'}
function contactTable(list){if(!list.length)return empty('No contacts found. Add your first lead or customer.');return '<div class="tablewrap"><table><thead><tr><th>Name</th><th>Company</th><th>Type</th><th>Email / Phone</th><th>Source</th><th>Actions</th></tr></thead><tbody>'+list.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="status">${esc(c.notes||'')}</div></td><td>${esc(c.company||'—')}</td><td>${pill(c.record_type)}</td><td>${esc(c.email||c.phone||'—')}</td><td>${esc(c.source||'—')}</td><td><button class="btn small" data-edit="contacts" data-id="${esc(c.id)}">Edit</button> <button class="btn small danger" data-delete="contacts" data-id="${esc(c.id)}">Delete</button></td></tr>`).join('')+'</tbody></table></div>'}
function dealTable(list){if(!list.length)return empty('No deals yet. Add your first sales opportunity.');return '<div class="tablewrap"><table><thead><tr><th>Deal</th><th>Contact</th><th>Value</th><th>Stage</th><th>Expected close</th><th>Actions</th></tr></thead><tbody>'+list.map(d=>`<tr><td><b>${esc(d.title)}</b><div class="status">${esc(d.notes||'')}</div></td><td>${esc(contactName(d.contact_id))}</td><td>${money(d.value_minor,d.currency)}</td><td>${pill(d.stage)}</td><td>${date(d.expected_close_date)}</td><td><button class="btn small" data-edit="deals" data-id="${esc(d.id)}">Edit</button> <button class="btn small danger" data-delete="deals" data-id="${esc(d.id)}">Delete</button></td></tr>`).join('')+'</tbody></table></div>'}
function activityTable(list){if(!list.length)return empty('No activities yet. Add a call, meeting, task or follow-up.');return '<div class="tablewrap"><table><thead><tr><th>Activity</th><th>Type</th><th>Contact</th><th>Deal</th><th>Due</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+list.map(a=>`<tr><td><b>${esc(a.title)}</b><div class="status">${esc(a.details||'')}</div></td><td>${esc(a.activity_type)}</td><td>${esc(contactName(a.contact_id))}</td><td>${esc(dealName(a.deal_id))}</td><td>${date(a.due_at)}</td><td>${a.completed_at?pill('Completed'):pill('Open')}</td><td><button class="btn small" data-edit="activities" data-id="${esc(a.id)}">Edit</button> <button class="btn small danger" data-delete="activities" data-id="${esc(a.id)}">Delete</button></td></tr>`).join('')+'</tbody></table></div>'}
function moduleCards(){return [['AI Sales Manager','Pipeline and opportunity tracking'],['AI Customer Support','Tickets and customer enquiries'],['WhatsApp Business AI','Messaging and follow-up workflows'],['AI Business Analytics','Performance and revenue reporting'],['AI Automation Center','Workflow triggers and execution']].map(x=>`<div class="quickitem module-card"><strong>${x[0]}</strong><span>${x[1]}</span><div style="margin-top:8px">${pill('Next module build')}</div></div>`).join('')}
function renderOverview(){let leads=contacts.filter(x=>x.record_type==='Lead').length,customers=contacts.filter(x=>x.record_type==='Customer').length,open=deals.filter(x=>!['Won','Lost'].includes(x.stage)),pipeline=open.reduce((s,x)=>s+(+x.value_minor||0),0);$('pageTitle').textContent='Business Overview';$('pageSub').textContent=(business?.name||'Your business')+' · Live records from Cloudflare D1';$('addBtn').textContent='＋ Add Contact';$('addBtn').style.display='';$('content').innerHTML=`<div class="grid"><div class="card"><div class="kpi">Total contacts</div><div class="metric">${contacts.length}</div><div class="kpi-foot">Saved in D1</div></div><div class="card"><div class="kpi">Leads</div><div class="metric">${leads}</div><div class="kpi-foot">Potential customers</div></div><div class="card"><div class="kpi">Customers</div><div class="metric">${customers}</div><div class="kpi-foot">Customer records</div></div><div class="card"><div class="kpi">Open deals</div><div class="metric">${open.length}</div><div class="kpi-foot">${money(pipeline)} pipeline value</div></div></div><section class="section"><div class="sectionhead"><h2>Quick actions</h2></div><div class="quick"><div class="quickitem" data-add="contacts"><strong>＋ Add Contact</strong><span>Create a lead or customer</span></div><div class="quickitem" data-gotab="deals"><strong>↗ Add Deal</strong><span>Track a sales opportunity</span></div><div class="quickitem" data-gotab="activities"><strong>＋ Log Activity</strong><span>Record a call, task or follow-up</span></div></div></section><section class="section"><div class="sectionhead"><h2>Recent contacts</h2><button class="btn" data-gopage="crm">View CRM</button></div>${contactTable(contacts.slice(0,5))}</section><section class="section"><div class="sectionhead"><h2>Business OS modules</h2></div><div class="modulegrid">${moduleCards()}</div></section>`}
function renderCrm(){const tabs=[['contacts','Contacts'],['deals','Deals & Pipeline'],['activities','Activities']];$('pageTitle').textContent='AI CRM';$('pageSub').textContent='Manage contacts, sales opportunities and relationship activities. Records are stored in D1.';$('addBtn').textContent=crmTab==='contacts'?'＋ Add Contact':crmTab==='deals'?'＋ Add Deal':'＋ Add Activity';$('addBtn').style.display='';let content=crmTab==='contacts'?contactTable(contacts.filter(c=>[c.name,c.company,c.email,c.phone,c.record_type,c.source,c.notes].join(' ').toLowerCase().includes(query))):crmTab==='deals'?dealTable(deals):activityTable(activities);$('content').innerHTML=`<div class="tabs">${tabs.map(([id,label])=>`<button class="tab ${crmTab===id?'active':''}" data-crmtab="${id}">${label} (${id==='contacts'?contacts.length:id==='deals'?deals.length:activities.length})</button>`).join('')}</div><div class="sectionhead"><h2>${tabs.find(x=>x[0]===crmTab)[1]}</h2><div class="toolbar">${crmTab==='contacts'?`<input class="search" id="search" placeholder="Search contacts…" value="${esc(query)}">`:''}<button class="btn" data-refresh>↻ Refresh</button></div></div>${content}`}
function renderModule(){let m={sales:['AI Sales Manager','Sales pipeline, opportunity tracking, proposals and sales assistance.'],support:['AI Customer Support','Customer enquiries, tickets, response drafts and resolution tracking.'],whatsapp:['WhatsApp Business AI','Messaging integration, AI replies, lead capture and follow-up workflows.'],analytics:['AI Business Analytics','Business performance, revenue trends, conversion metrics and reporting.'],automation:['AI Automation Center','Workflow triggers, scheduled tasks, connected actions and execution history.']}[page];$('pageTitle').textContent=m[0];$('pageSub').textContent=m[1];$('addBtn').style.display='none';$('content').innerHTML=`<div class="card"><div class="eyebrow">BUSINESS OS MODULE</div><h2>${m[0]}</h2><p class="sub">${m[1]}</p><p>This module is scaffolded for its next development stage. It can read shared CRM totals; its dedicated workflows will be implemented in its module phase.</p>${pill('Scaffolded')} ${pill('D1 CRM connected')} ${pill('Next module build')}</div><section class="section"><h2>Shared CRM records</h2><div class="grid"><div class="card"><div class="kpi">Contacts</div><div class="metric">${contacts.length}</div></div><div class="card"><div class="kpi">Deals</div><div class="metric">${deals.length}</div></div><div class="card"><div class="kpi">Activities</div><div class="metric">${activities.length}</div></div><div class="card"><div class="kpi">Storage</div><div class="metric" style="font-size:18px">Cloudflare D1</div></div></div></section>`}
function render(){if(page==='overview')renderOverview();else if(page==='crm')renderCrm();else renderModule()}
function textField(n,l,v='',type='text',attrs=''){return `<div class="field"><label for="f_${n}">${l}</label><input id="f_${n}" name="${n}" type="${type}" value="${esc(v)}" ${attrs}></div>`}
function selectField(n,l,opts,v=''){return `<div class="field"><label for="f_${n}">${l}</label><select id="f_${n}" name="${n}">${opts.map(o=>`<option value="${esc(o.value)}" ${o.value===v?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`}
function area(n,l,v=''){return `<div class="field full"><label for="f_${n}">${l}</label><textarea id="f_${n}" name="${n}">${esc(v)}</textarea></div>`}
function contactOptions(selected){return [{value:'',label:'No linked contact'},...contacts.map(c=>({value:c.id,label:c.name}))].map(o=>({...o,selected:o.value===selected}))}
function openForm(c,r=null){let f=$('formFields'),m='';$('recordForm').dataset.collection=c;$('recordForm').dataset.id=r?.id||'';
 if(c==='contacts')m=textField('name','Name *',r?.name||'','text','required maxlength="120"')+textField('company','Company',r?.company||'')+textField('email','Email',r?.email||'','email','maxlength="160"')+textField('phone','Phone',r?.phone||'','tel','maxlength="40"')+selectField('record_type','Record type',['Lead','Customer'].map(x=>({value:x,label:x})),r?.record_type||'Lead')+selectField('source','Lead source',['Not specified','Website','Referral','Social media','WhatsApp','Walk-in','Other'].map(x=>({value:x,label:x})),r?.source||'Not specified')+area('notes','Notes',r?.notes||'');
 if(c==='deals')m=textField('title','Deal title *',r?.title||'','text','required maxlength="180"')+textField('value','Value (NGN)',r?(+r.value_minor||0)/100:0,'number','min="0" step="0.01"')+selectField('stage','Stage',['New','Qualified','Proposal','Negotiation','Won','Lost'].map(x=>({value:x,label:x})),r?.stage||'New')+selectField('contact_id','Linked contact',contactOptions(r?.contact_id||''),r?.contact_id||'')+textField('expected_close_date','Expected close date',r?.expected_close_date||'','date')+area('notes','Notes',r?.notes||'');
 if(c==='activities')m=textField('title','Activity title *',r?.title||'','text','required maxlength="180"')+selectField('activity_type','Activity type',['Task','Call','Meeting','Email','Follow-up','Note'].map(x=>({value:x,label:x})),r?.activity_type||'Task')+selectField('contact_id','Linked contact',contactOptions(r?.contact_id||''),r?.contact_id||'')+selectField('deal_id','Linked deal',[{value:'',label:'No linked deal'},...deals.map(d=>({value:d.id,label:d.title}))],r?.deal_id||'')+textField('due_at','Due date/time',r?.due_at||'','datetime-local')+area('details','Details',r?.details||'')+textField('completed_at','Completed date/time',r?.completed_at||'','datetime-local');
 f.innerHTML=m;$('modalTitle').textContent=(r?'Edit ':'Add ')+(c==='contacts'?'Contact':c==='deals'?'Deal':'Activity');$('saveButton').textContent=r?'Save changes':'Save';$('modal').classList.add('show')}
function closeForm(){$('modal').classList.remove('show')}
function payload(form){let d=Object.fromEntries(new FormData(form));for(let k in d)if(d[k]==='')d[k]=null;if(form.dataset.collection==='deals'){d.value_minor=Math.round(Number(d.value||0)*100);delete d.value}return d}
async function save(e){e.preventDefault();let f=e.target,c=f.dataset.collection,id=f.dataset.id,b=$('saveButton');b.disabled=true;b.textContent='Saving…';try{await api('/crm/'+c+(id?'/'+encodeURIComponent(id):''),{method:id?'PUT':'POST',body:JSON.stringify(payload(f))});await refresh(c);closeForm();render();toast(id?'Record updated in D1.':'Record saved to D1.')}catch(err){toast(err.message)}finally{b.disabled=false;b.textContent=id?'Save changes':'Save'}}
async function remove(c,id){if(!confirm('Permanently delete this record from the CRM database?'))return;try{await api('/crm/'+c+'/'+encodeURIComponent(id),{method:'DELETE'});await refresh(c);render();toast('Record deleted from D1.')}catch(err){toast(err.message)}}
function goCrm(tab){page='crm';crmTab=tab;query='';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='crm'));render()}
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;query='';document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
$('addBtn').addEventListener('click',()=>openForm(crmTab));
$('content').addEventListener('click',e=>{let t=e.target.closest('[data-crmtab]');if(t){crmTab=t.dataset.crmtab;query='';render();return}let a=e.target.closest('[data-add]');if(a){openForm(a.dataset.add);return}let gt=e.target.closest('[data-gotab]');if(gt){goCrm(gt.dataset.gotab);openForm(gt.dataset.gotab);return}let gp=e.target.closest('[data-gopage]');if(gp){page=gp.dataset.gopage;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render();return}if(e.target.closest('[data-refresh]')){loadAll().catch(x=>toast(x.message));return}let ed=e.target.closest('[data-edit]');if(ed){let c=ed.dataset.edit,arr=c==='contacts'?contacts:c==='deals'?deals:activities,r=arr.find(x=>x.id===ed.dataset.id);if(r)openForm(c,r);return}let del=e.target.closest('[data-delete]');if(del)remove(del.dataset.delete,del.dataset.id)});
$('content').addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value.toLowerCase();let p=e.target.selectionStart;render();let s=$('search');if(s){s.focus();s.setSelectionRange(p,p)}}});
$('recordForm').addEventListener('submit',save);$('cancel').addEventListener('click',closeForm);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeForm()});
(async()=>{try{await loadAll()}catch(e){status('D1 connection failed',false);$('content').innerHTML=`<div class="card"><h2>Could not connect to CAPTIVATE CRM</h2><p class="sub">${esc(e.message)}</p><p>Confirm the Worker is deployed and the D1 database is bound as <b>CRM_DB</b>.</p><button class="btn primary" id="retry">Retry connection</button><p class="status">API endpoint: ${esc(API)}</p></div>`;$('content').addEventListener('click',e=>{if(e.target.id==='retry')loadAll().catch(x=>toast(x.message))})}})();
})();
</script></body></html>
