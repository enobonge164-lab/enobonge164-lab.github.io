<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Hashtag Generator | Sirwhite The Polymath</title>

<link rel="stylesheet" href="premium.css">

<style>

.generate-btn{
    width:100%;
    margin-top:12px;
}

.generate-btn:disabled{
    opacity:0.7;
    cursor:not-allowed;
}

#result{
    min-height:80px;
    margin-top:20px;
    white-space:pre-wrap;
}

</style>

</head>

<body>

<div class="container">

<a class="back" href="index.html">
⬅ Back to Captivate AI
</a>

<div class="card">

<h1>🔖 AI Hashtag Generator</h1>

<p>
Generate relevant hashtags for your social media content.
</p>

<textarea
id="topic"
placeholder="Example: AI tools for beginners">
</textarea>

<select id="platform">

<option value="Facebook">Facebook</option>

<option value="Instagram">Instagram</option>

<option value="LinkedIn">LinkedIn</option>

<option value="X (Twitter)">X (Twitter)</option>

<option value="TikTok">TikTok</option>

</select>

<button
id="generateBtn"
class="generate-btn"
onclick="generateHashtags()">

Generate Hashtags

</button>

<div id="result"></div>

<button
onclick="copyResult()"
class="btn">

📋 Copy Hashtags

</button>

</div>

</div>

<div id="toast" class="toast">
✅ Hashtags copied successfully!
</div>


<script>

async function generateHashtags(){

    const topic =
        document.getElementById("topic").value.trim();

    const platform =
        document.getElementById("platform").value;

    const result =
        document.getElementById("result");

    const button =
        document.getElementById("generateBtn");


    /* Check topic */

    if(!topic){

        alert("Please enter a topic.");

        return;

    }


    /* Loading state */

    button.disabled = true;

    button.innerText =
        "⏳ Generating...";

    result.innerText =
        "🤖 Captivate AI is generating your hashtags...";


    try{

        const response = await fetch(

            "https://captivate-ai-api.sirwhitethepolymath.workers.dev/",

            {

                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    type:"hashtags",

                    topic:topic,

                    platform:platform

                })

            }

        );


        /* Read response */

        const data =
            await response.json();


        /* Check server */

        if(!response.ok){

            throw new Error(
                data.error ||
                "Unable to generate hashtags."
            );

        }


        /* Get hashtag result */

        let hashtags =
            data.hashtags ||
            data.caption ||
            data.result ||
            "";


        /* Check result */

        if(!hashtags){

            throw new Error(
                "No hashtags were returned."
            );

        }


        /* Clean response */

        hashtags =
            hashtags

            .replace(/\\n/g,"\n")

            .replace(/^"+|"+$/g,"")

            .trim();


        result.innerText =
            hashtags;


    }catch(error){

        console.error(error);

        result.innerText =
            "❌ Something went wrong while generating your hashtags.\n\nPlease try again.";

    }finally{

        /* Restore button */

        button.disabled = false;

        button.innerText =
            "Generate Hashtags";

    }

}


/* Copy hashtags */

function copyResult(){

    const result =
        document.getElementById("result").innerText;


    if(!result.trim()){

        alert("Nothing to copy.");

        return;

    }


    navigator.clipboard.writeText(result);


    const toast =
        document.getElementById("toast");


    if(toast){

        toast.classList.add("show");


        setTimeout(()=>{

            toast.classList.remove("show");

        },2500);

    }

}

</script>

</body>

</html>
