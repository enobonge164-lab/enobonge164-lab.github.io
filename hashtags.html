<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Hashtag Generator | Sirwhite The Polymath</title>

<link rel="stylesheet" href="premium.css">

</head>

<body>

<div class="container">

<a class="back" href="index.html">⬅ Back to Portfolio</a>

<div class="card">

<h1>AI Hashtag Generator</h1>

<p>Generate relevant hashtags for your social media content.</p>

<textarea
id="topic"
placeholder="Example: AI tools for beginners">
</textarea>

<select id="platform">
    <option value="Facebook">Facebook</option>
    <option value="Instagram">Instagram</option>
    <option value="LinkedIn">LinkedIn</option>
    <option value="X (Twitter)">X (Twitter)</option>
    <option value="TikTok">TikTok</option>
</select>

<button onclick="generateHashtags()">
Generate Hashtags
</button>

<div id="result"></div>

<button onclick="copyResult()" class="btn">
📋 Copy Hashtags
</button>

</div>

</div>

<script>

async function generateHashtags() {

    const topic = document.getElementById("topic").value;
    const platform = document.getElementById("platform").value;

    if (!topic.trim()) {
        alert("Please enter a topic.");
        return;
    }

    document.getElementById("result").innerText =
        "Generating hashtags...";

    try {

        const response = await fetch(
            "https://captivate-ai-api.sirwhitethepolymath.workers.dev/",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    type: "hashtags",
                    topic: topic,
                    platform: platform
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Unable to generate hashtags."
            );
        }

        let hashtags = data.hashtags || data.caption || data.result || "";

        hashtags = hashtags
            .replace(/\\n/g, "\n")
            .trim();

        if (hashtags.startsWith('"')) {
            hashtags = hashtags.substring(1);
        }

        if (hashtags.endsWith('"')) {
            hashtags = hashtags.substring(
                0,
                hashtags.length - 1
            );
        }

        document.getElementById("result").innerText =
            hashtags.trim();

    } catch (err) {

        console.error(err);

        document.getElementById("result").innerText =
            "Error connecting to AI.";

    }
}


function copyResult() {

    const result =
        document.getElementById("result").innerText;

    if (result.trim() === "") {

        alert("Nothing to copy.");

        return;
    }

    navigator.clipboard.writeText(result);

    alert("✅ Hashtags copied successfully!");

}

</script>

</body>
</html>
