<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Prompt Generator | Sirwhite The Polymath</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<a class="back" href="index.html">← Back to Portfolio</a>

<div class="card">

<h1>🧠 AI Prompt Generator</h1>

<p>Create powerful ChatGPT prompts instantly.</p>

<select id="category">
<option>Business</option>
<option>Marketing</option>
<option>YouTube</option>
<option>Coding</option>
<option>Social Media</option>
<option>Education</option>
<option>Productivity</option>
</select>

<textarea
id="topic"
placeholder="Example: Facebook Ads">
</textarea>

<button onclick="generatePrompt()">
Generate Prompt
</button>

<div id="result"></div>

<button onclick="copyPrompt()" class="btn">
📋 Copy Prompt
</button>

</div>

</div>

<div id="toast" class="toast">
✅ Prompt copied successfully!
</div>

<script>

async function generatePrompt(){

    const category = document.getElementById("category").value;
    const topic = document.getElementById("topic").value;

    if(topic.trim() === ""){
        alert("Enter a topic.");
        return;
    }

    const result = document.getElementById("result");

    result.innerText = "⏳ Creating your AI prompt...";

    try {

        const response = await fetch(
            "https://captivate-ai-api.sirwhitethepolymath.workers.dev",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },

                body: JSON.stringify({
                    type: "prompt",
                    category: category,
                    topic: topic
                })
            }
        );

        const data = await response.json();

        if(!response.ok){
            throw new Error(data.error || "AI generation failed.");
        }

        if(data.result){
            result.innerText = data.result;
        }
        else if(data.output){
            result.innerText = data.output;
        }
        else if(data.text){
            result.innerText = data.text;
        }
        else {
            result.innerText = JSON.stringify(data, null, 2);
        }

    } catch(error){

        console.error(error);

        result.innerText =
            "❌ Error generating prompt.\n\n" +
            error.message;
    }
}


function copyPrompt(){

    const result = document.getElementById("result").innerText;

    if(
        result.trim() === "" ||
        result.includes("Creating your AI prompt")
    ){
        alert("Nothing to copy.");
        return;
    }

    navigator.clipboard.writeText(result);

    const toast = document.getElementById("toast");

    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);
}

</script>

</body>

</html>
