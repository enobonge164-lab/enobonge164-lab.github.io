<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Prompt Generator | Sirwhite The Polymath</title>

<link rel="stylesheet" href="style.css">

<style>

.generate-btn{
    width:100%;
    margin-top:12px;
}

.generate-btn:disabled{
    opacity:0.7;
    cursor:not-allowed;
}

#result{
    min-height:120px;
    margin-top:20px;
    white-space:pre-wrap;
    line-height:1.6;
}

</style>

</head>

<body>

<div class="container">

<a class="back" href="index.html">
⬅ Back to Captivate AI
</a>

<div class="card">

<h1>🧠 AI Prompt Generator</h1>

<p>
Create powerful AI prompts for any task.
</p>


<select id="category">

<option value="Business">Business</option>
<option value="Marketing">Marketing</option>
<option value="YouTube">YouTube</option>
<option value="Coding">Coding</option>
<option value="Social Media">Social Media</option>
<option value="Education">Education</option>
<option value="Productivity">Productivity</option>

</select>


<textarea
id="topic"
placeholder="Example: Facebook Ads">
</textarea>


<button
id="generateBtn"
class="generate-btn"
onclick="generatePrompt()">

Generate Prompt

</button>


<div id="result"></div>


<button
onclick="copyPrompt()"
class="btn">

📋 Copy Prompt

</button>

</div>

</div>


<div id="toast" class="toast">
✅ Prompt copied successfully!
</div>


<script>

async function generatePrompt(){

    const category =
        document.getElementById("category").value;

    const topic =
        document.getElementById("topic").value.trim();

    const result =
        document.getElementById("result");

    const button =
        document.getElementById("generateBtn");


    /* Validate topic */

    if(!topic){

        alert("Please enter a topic.");

        return;

    }


    /* Loading state */

    button.disabled = true;

    button.innerText =
        "⏳ Generating...";

    result.innerText =
        "🤖 Captivate AI is creating your professional prompt...";


    try{

        const response = await fetch(

            "https://captivate-ai-api.sirwhitethepolymath.workers.dev/",

            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json",

                    "Accept":
                    "application/json"

                },

                body:JSON.stringify({

                    type:"prompt",

                    category:category,

                    topic:topic

                })

            }

        );


        const data =
            await response.json();


        /* Check server response */

        if(!response.ok){

            throw new Error(

                data.error ||
                data.message ||
                "AI generation failed."

            );

        }


        /* Get generated prompt */

        const prompt =

            data.result ||

            data.output ||

            data.text ||

            data.prompt ||

            "";


        if(!prompt){

            throw new Error(
                "No prompt was returned by the AI."
            );

        }


        /* Clean response */

        const cleanPrompt =
            prompt

            .replace(/\\n/g,"\n")

            .replace(/^"+|"+$/g,"")

            .trim();


        /* Display result */

        result.innerText =
            cleanPrompt;


    }catch(error){

        console.error(error);

        result.innerText =

            "❌ Error generating prompt.\n\n" +

            (error.message ||
            "Please try again.");

    }finally{

        /* Restore button */

        button.disabled = false;

        button.innerText =
            "Generate Prompt";

    }

}


/* Copy Prompt */

function copyPrompt(){

    const result =
        document.getElementById("result").innerText;


    if(

        !result.trim() ||

        result.includes(
            "Captivate AI is creating"
        ) ||

        result.includes(
            "Error generating prompt"
        )

    ){

        alert("Generate a prompt first.");

        return;

    }


    navigator.clipboard.writeText(result)

    .then(()=>{

        const toast =
            document.getElementById("toast");

        if(toast){

            toast.classList.add("show");


            setTimeout(()=>{

                toast.classList.remove("show");

            },2500);

        }

    })

    .catch(()=>{

        alert(
            "Unable to copy automatically. Please select and copy the prompt."
        );

    });

}

</script>

</body>

</html>
