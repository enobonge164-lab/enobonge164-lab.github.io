<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAPTIVATE AI — Gaming Assistant</title>
<style>
:root{--bg:#080b12;--panel:#111827;--panel2:#0d111a;--border:#273149;--text:#f8fafc;--muted:#a7b0c3;--primary:#8b5cf6;--primary2:#a78bfa;--danger:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.hero{padding:22px;border:1px solid var(--border);border-radius:20px;background:linear-gradient(145deg,#111827,#0d111a);margin-bottom:18px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#241a43;color:#c4b5fd;font-size:12px;font-weight:800}.hero h1{margin:12px 0 6px;font-size:30px}.hero p{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}.field label{font-size:13px;color:#cbd5e1;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);background:#0b1019;color:var(--text);border-radius:12px;padding:12px;font:inherit;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary)}textarea{min-height:105px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:white}.secondary{background:#1b2435;color:#e5e7eb;border:1px solid var(--border)}.status{padding:12px;border-radius:12px;background:#0d1420;border:1px solid var(--border);color:var(--muted);white-space:pre-wrap}.status.ok{border-color:#315f49;color:#b7f7cf}.status.err{border-color:#6b3030;color:#fecaca}.results{margin-top:18px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.tab{white-space:nowrap;background:#101827;color:#cbd5e1;border:1px solid var(--border);padding:10px 13px;border-radius:10px;cursor:pointer}.tab.active{background:#2b1b50;border-color:var(--primary);color:#fff}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;min-height:120px}.card h2{margin:0 0 12px}.card h3{margin:18px 0 8px;color:#c4b5fd}.item{padding:10px 12px;border-left:3px solid var(--primary);background:#0d1420;border-radius:8px;margin:8px 0;color:#dbe4f0}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.meta div{background:#0d1420;border:1px solid var(--border);padding:10px;border-radius:10px}.meta small{display:block;color:var(--muted);margin-bottom:4px}.code{background:#070a10;border:1px solid var(--border);padding:14px;border-radius:12px;white-space:pre-wrap;overflow:auto;line-height:1.55;font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px}.raw{max-height:600px;overflow:auto}.hidden{display:none}.empty{color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.meta{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <span class="badge">CAPTIVATE AI • GAMING ASSISTANT v8.0</span>
    <h1>🎮 AI Gaming Assistant</h1>
    <p>Get structured strategy, practice plans, decision rules, builds, teamwork guidance and troubleshooting for your game.</p>
  </section>

  <section class="card">
    <div class="grid">
      <div class="field"><label>Game</label><input id="game" placeholder="e.g. PUBG Mobile"></div>
      <div class="field"><label>Genre</label><input id="genre" placeholder="e.g. Battle Royale"></div>
      <div class="field"><label>Platform</label><input id="platform" placeholder="e.g. Android / PC / PlayStation"></div>
      <div class="field"><label>Mode</label><input id="mode" placeholder="e.g. Squad / Ranked / Multiplayer"></div>
      <div class="field"><label>Role / Character</label><input id="role" placeholder="e.g. Assault / Support / Mage"></div>
      <div class="field"><label>Skill Level</label><select id="skillLevel"><option value="">Select</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>Competitive</option></select></div>
      <div class="field full"><label>Primary Goal</label><input id="goal" placeholder="What are you trying to improve or achieve?"></div>
      <div class="field full"><label>Gaming Request *</label><textarea id="request" placeholder="Ask your gaming question or describe what you want help with..."></textarea></div>
      <div class="field"><label>Problems / Obstacles</label><textarea id="problems" placeholder="What keeps going wrong?"></textarea></div>
      <div class="field"><label>Playstyle Preferences</label><textarea id="preferences" placeholder="Aggressive, defensive, strategic, casual, etc."></textarea></div>
      <div class="field full"><label>Extra Requirements</label><textarea id="extra" placeholder="Any other details, restrictions or preferences..."></textarea></div>
    </div>
    <div class="actions"><button class="btn primary" id="generate">🎮 Generate Gaming Plan</button><button class="btn secondary" id="clear">Clear</button></div>
    <div class="status" id="status">Ready.</div>
  </section>

  <section class="results hidden" id="results">
    <div class="tabs" id="tabs"></div>
    <div class="card" id="content"></div>
  </section>
</div>
<script>
const API_URL="https://captivate-ai-api.sirwhitethepolymath.workers.dev";
const $=id=>document.getElementById(id);
let current=null, activeTab="overview";
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function arr(v){if(!Array.isArray(v))return [];return v.flatMap(x=>{if(x==null)return[];if(typeof x==='string')return[x];if(typeof x==='object'){let title=x.title||x.name||x.rule||x.step||"";let detail=x.detail||x.description||x.reason||x.action||x.notes||"";return[title&&detail?`${title}: ${detail}`:title||detail||JSON.stringify(x)]}return[String(x)]}).filter(Boolean)}
function list(v){const a=arr(v);return a.length?a.map(x=>`<div class="item">${esc(x)}</div>`).join(''):'<div class="empty">No specific items were returned.</div>'}
function val(obj,...keys){for(const k of keys){if(obj&&obj[k]!=null&&obj[k]!=="")return obj[k]}return ""}
function objectText(v){if(v==null)return"";if(typeof v==='string')return v;return JSON.stringify(v,null,2)}
function render(){if(!current)return;const r=current.output&&typeof current.output==='object'?current.output:(current.gamingAssistant&&typeof current.gamingAssistant==='object'?current.gamingAssistant:current);const game=r.game&&typeof r.game==='object'?r.game:{};const tabs=[['overview','Overview'],['strategy','Strategy'],['build','Loadout / Build'],['settings','Settings'],['practice','Practice Plan'],['mistakes','Mistakes to Avoid'],['rules','Decision Rules'],['progression','Progression'],['teamwork','Teamwork'],['challenges','Challenges'],['troubleshooting','Troubleshooting'],['next','Next Steps'],['raw','Raw Response']];$('tabs').innerHTML=tabs.map(([id,label])=>`<button class="tab ${activeTab===id?'active':''}" data-tab="${id}">${label}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render()});let html='';
if(activeTab==='overview')html=`<h2>🎮 Gaming Overview</h2><div class="meta"><div><small>Game</small>${esc(val(game,'name'))||'—'}</div><div><small>Genre</small>${esc(val(game,'genre'))||'—'}</div><div><small>Platform</small>${esc(val(game,'platform'))||'—'}</div><div><small>Mode</small>${esc(val(game,'mode'))||'—'}</div></div><h3>Summary</h3><div class="item">${esc(val(r,'summary')||val(current,'result')||'Gaming guidance generated successfully.')}</div><h3>Assumptions</h3>${list(r.assumptions)}`;
else if(activeTab==='strategy')html=`<h2>🎯 Strategy</h2>${list(r.strategy)}`;
else if(activeTab==='build')html=`<h2>🧰 Loadout / Build</h2>${list(val(r,'loadoutOrBuild','loadout','build'))}`;
else if(activeTab==='settings')html=`<h2>⚙️ Settings</h2>${list(r.settings)}`;
else if(activeTab==='practice')html=`<h2>🏋️ Practice Plan</h2>${list(val(r,'practicePlan','trainingPlan'))}`;
else if(activeTab==='mistakes')html=`<h2>⚠️ Mistakes to Avoid</h2>${list(val(r,'mistakesToAvoid','mistakes'))}`;
else if(activeTab==='rules')html=`<h2>🧠 Decision Rules</h2>${list(val(r,'decisionRules','rules'))}`;
else if(activeTab==='progression')html=`<h2>📈 Progression Plan</h2>${list(val(r,'progressionPlan','progression'))}`;
else if(activeTab==='teamwork')html=`<h2>🤝 Teamwork</h2>${list(val(r,'teamwork','teamPlay'))}`;
else if(activeTab==='challenges')html=`<h2>🏆 Challenges</h2>${list(r.challenges)}`;
else if(activeTab==='troubleshooting')html=`<h2>🔧 Troubleshooting</h2>${list(val(r,'troubleshooting','commonProblems'))}`;
else if(activeTab==='next')html=`<h2>🚀 Next Steps</h2>${list(r.nextSteps)}<div class="actions"><button class="btn secondary" onclick="copyText(${JSON.stringify(arr(r.nextSteps).join('\n'))})">Copy Next Steps</button></div>`;
else html=`<h2>📦 Raw Response</h2><div class="actions"><button class="btn secondary" onclick="copyText(${JSON.stringify(JSON.stringify(current,null,2))})">Copy Raw JSON</button></div><pre class="code raw">${esc(JSON.stringify(current,null,2))}</pre>`;
$('content').innerHTML=html;$('results').classList.remove('hidden')}
async function copyText(text){try{await navigator.clipboard.writeText(text);setStatus('Copied to clipboard.','ok')}catch(e){setStatus('Copy failed. Select and copy the text manually.','err')}}
function setStatus(t,c=''){ $('status').textContent=t;$('status').className='status '+c }
$('generate').onclick=async()=>{const request=$('request').value.trim();if(!request){setStatus('Please enter a Gaming Request.','err');return}const payload={type:'gaming-assistant',game:$('game').value.trim(),genre:$('genre').value.trim(),platform:$('platform').value.trim()||'General',mode:$('mode').value.trim(),role:$('role').value.trim(),skillLevel:$('skillLevel').value,goal:$('goal').value.trim(),request,problems:$('problems').value.trim(),preferences:$('preferences').value.trim(),extra:$('extra').value.trim()};$('generate').disabled=true;setStatus('Generating your gaming plan...');try{const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const text=await res.text();let data;try{data=JSON.parse(text)}catch{throw new Error(`Server returned non-JSON response (HTTP ${res.status}).`)}if(!res.ok||data.success===false)throw new Error(data.error||data.message||`Request failed with HTTP ${res.status}`);current=data;activeTab='overview';render();setStatus(`Completed • ${data.version||'v8.0'} • ${data.model||'Gaming Assistant'}`,'ok')}catch(e){console.error(e);setStatus(e.message||'Gaming Assistant failed.','err')}finally{$('generate').disabled=false}};
$('clear').onclick=()=>{document.querySelectorAll('input,textarea').forEach(x=>x.value='');$('skillLevel').value='';$('results').classList.add('hidden');current=null;setStatus('Ready.')};
</script>
</body>
</html>
