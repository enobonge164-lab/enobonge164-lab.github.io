<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CAPTIVATE AI — Gaming Tools</title>
<style>
:root{--bg:#080b12;--panel:#111827;--panel2:#0d111a;--border:#263044;--text:#f8fafc;--muted:#9ca3af;--primary:#8b5cf6;--primary2:#a78bfa;--success:#22c55e;--danger:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;line-height:1.5}.wrap{max-width:1100px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.brand{font-weight:800;letter-spacing:.4px}.brand span{color:var(--primary2)}.back{color:var(--muted);text-decoration:none;font-size:14px}.hero{background:linear-gradient(145deg,#151126,#111827);border:1px solid var(--border);border-radius:20px;padding:25px;margin-bottom:18px}.badge{display:inline-block;padding:5px 10px;border:1px solid #4c3b78;border-radius:999px;color:var(--primary2);font-size:12px;font-weight:700}.hero h1{font-size:30px;margin:12px 0 6px}.hero p{margin:0;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#dbe3f0}input,select,textarea{width:100%;border:1px solid var(--border);background:#0a0f18;color:var(--text);border-radius:11px;padding:12px;font:inherit;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--primary)}textarea{min-height:92px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:11px;padding:12px 17px;font-weight:800;cursor:pointer;background:var(--primary);color:white}button.secondary{background:#20283a}button:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:13px;padding:11px 13px;border-radius:10px;background:#0b1220;color:var(--muted);font-size:13px}.status.ok{color:#86efac;border:1px solid #14532d}.status.err{color:#fca5a5;border:1px solid #7f1d1d}.hidden{display:none}.result-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.result-title{font-size:24px;margin:0}.pill{font-size:12px;padding:5px 9px;border-radius:999px;background:#1b1630;color:var(--primary2);border:1px solid #3c2c64}.summary{color:#d5dbe6}.section{margin-top:20px}.section h3{font-size:16px;margin:0 0 10px;color:var(--primary2)}.list{margin:0;padding-left:20px}.list li{margin:7px 0}.mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mini{border:1px solid var(--border);background:var(--panel2);border-radius:12px;padding:12px}.mini b{display:block;color:#e5e7eb;font-size:13px;margin-bottom:4px}.mini span{color:var(--muted);font-size:13px}.raw{background:#070a10;border:1px solid var(--border);padding:14px;border-radius:12px;white-space:pre-wrap;overflow:auto;font-size:12px;color:#cbd5e1;max-height:430px}.empty{color:var(--muted);font-size:13px}.footer{text-align:center;color:#6b7280;font-size:12px;padding:10px}.loader{display:inline-block;width:12px;height:12px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.wrap{padding:14px}.grid,.mini-grid{grid-template-columns:1fr}.hero h1{font-size:25px}.card{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">CAPTIVATE <span>AI</span></div><a class="back" href="index.html">← Back to Workspace</a></div>
  <section class="hero"><span class="badge">GAMING TOOLS • v8.2</span><h1>Gaming Tools</h1><p>Build practical gaming strategies, loadouts, settings, practice plans and troubleshooting guides.</p></section>

  <section class="card">
    <div class="grid">
      <div><label for="game">Game *</label><input id="game" placeholder="e.g. Call of Duty Mobile"></div>
      <div><label for="toolType">Tool Type</label><select id="toolType"><option>Strategy Planner</option><option>Aim/Skill Trainer</option><option>Loadout Builder</option><option>Settings Optimizer</option><option>Beginner Coach</option><option>Rank/Progression Planner</option><option>Troubleshooting Assistant</option><option>Challenge Generator</option><option>Gaming Session Planner</option><option>Custom Gaming Tool</option></select></div>
      <div><label for="platform">Platform</label><input id="platform" placeholder="Mobile, PC, PlayStation, Xbox..."></div>
      <div><label for="mode">Mode</label><input id="mode" placeholder="Ranked, Multiplayer, Battle Royale..."></div>
      <div><label for="skillLevel">Skill Level</label><select id="skillLevel"><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>Competitive</option></select></div>
      <div><label for="character">Character / Role</label><input id="character" placeholder="Optional character, class or role"></div>
      <div class="full"><label for="goal">Goal / Objective</label><textarea id="goal" placeholder="What do you want the gaming tool to help you achieve?"></textarea></div>
      <div><label for="playstyle">Playstyle</label><input id="playstyle" placeholder="Aggressive, defensive, support, balanced..."></div>
      <div><label for="loadout">Current Loadout</label><textarea id="loadout" placeholder="Weapons, perks, equipment, character setup..." ></textarea></div>
      <div><label for="settings">Current Settings</label><textarea id="settings" placeholder="Sensitivity, graphics, controls, keybinds..." ></textarea></div>
      <div><label for="issue">Problem / Challenge</label><textarea id="issue" placeholder="Describe what is going wrong, if any."></textarea></div>
      <div class="full"><label for="extra">Extra Instructions</label><textarea id="extra" placeholder="Any specific preferences or constraints..."></textarea></div>
    </div>
    <div class="actions"><button id="generate">🎮 Generate Gaming Tool</button><button class="secondary" id="clear" type="button">Clear</button></div>
    <div id="status" class="status">Ready.</div>
  </section>

  <section id="results" class="card hidden">
    <div class="result-head"><div><h2 id="resultTitle" class="result-title">Gaming Tool</h2><p id="resultSummary" class="summary"></p></div><span id="resultPill" class="pill">Completed</span></div>
    <div id="dynamic"></div>
    <div class="section"><h3>Raw JSON</h3><pre id="raw" class="raw"></pre><div class="actions"><button class="secondary" id="copy">Copy Raw JSON</button></div></div>
  </section>
  <div class="footer">CAPTIVATE AI • Gaming Tools • Cloudflare Workers AI</div>
</div>
<script>
const API_URL='https://captivate-ai-api.sirwhitethepolymath.workers.dev';
const $=id=>document.getElementById(id);
const text=v=>{if(v===undefined||v===null)return '';if(typeof v==='string'||typeof v==='number'||typeof v==='boolean')return String(v);return '';};
const arr=v=>Array.isArray(v)?v:(v==null||v===''?[]:[v]);
function section(title,content){if(!content)return '';return `<div class="section"><h3>${escapeHtml(title)}</h3>${content}</div>`}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function list(items){const a=arr(items).map(x=>text(x)).filter(Boolean);return a.length?`<ul class="list">${a.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`:'<div class="empty">No items returned.</div>';}
function objectCards(items, fields){const a=arr(items).filter(x=>x&&typeof x==='object');if(!a.length)return '<div class="empty">No items returned.</div>';return `<div class="mini-grid">${a.map(o=>`<div class="mini">${fields.map(([k,l])=>{const v=text(o[k]);return v?`<b>${escapeHtml(l)}</b><span>${escapeHtml(v)}</span><br>`:''}).join('')}</div>`).join('')}</div>`;}
function normalizeTool(data){let t=data?.tool||data?.output||data?.result||data; if(typeof t==='string'){try{t=JSON.parse(t)}catch{return {title:'Gaming Tool',summary:t}}}return t&&typeof t==='object'?t:{};}
function renderTool(data){const t=normalizeTool(data);$('resultTitle').textContent=text(t.title)||'Gaming Tool';$('resultSummary').textContent=text(t.summary)||'Your structured gaming tool is ready.';let h='';h+=section('Quick Actions',list(t.quickActions));h+=section('Recommendations',list(t.recommendations));h+=section('Steps',list(t.steps));h+=section('Settings',objectCards(t.settings,[['name','Setting'],['value','Value'],['reason','Reason']]));h+=section('Loadout',objectCards(t.loadout,[['slot','Slot'],['choice','Choice'],['reason','Reason'],['alternative','Alternative']]));h+=section('Practice Plan',objectCards(t.practice,[['exercise','Exercise'],['duration','Duration'],['goal','Goal']]));h+=section('Troubleshooting',objectCards(t.troubleshooting,[['problem','Problem'],['cause','Cause'],['fix','Fix']]));h+=section('Checklist',list(t.checklist));h+=section('Next Steps',list(t.nextSteps));h+=section('Notes & Assumptions',list([...(arr(t.notes)),...(arr(t.assumptions).map(x=>'Assumption: '+x)]));$('dynamic').innerHTML=h||'<div class="empty">The AI returned no structured sections.</div>';const raw=JSON.stringify(data,null,2);$('raw').textContent=raw;$('results').classList.remove('hidden');return raw;}
function val(id){return $(id).value.trim();}
$('generate').onclick=async()=>{const game=val('game');if(!game){$('status').className='status err';$('status').textContent='Please enter a game name.';return}const payload={type:'gaming-tools',game,toolType:val('toolType'),platform:val('platform'),mode:val('mode'),skillLevel:val('skillLevel'),goal:val('goal'),character:val('character'),playstyle:val('playstyle'),loadout:val('loadout'),settings:val('settings'),issue:val('issue'),extra:val('extra')};$('generate').disabled=true;$('status').className='status';$('status').innerHTML='<span class="loader"></span>Generating gaming tool...';try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok||data.success===false)throw new Error(data.error||'The server returned an error.');renderTool(data);$('resultPill').textContent=`Completed • v${data.version||'8.2'}`;$('status').className='status ok';$('status').textContent='Completed • Gaming tool generated successfully.';$('results').scrollIntoView({behavior:'smooth'});}catch(e){$('status').className='status err';$('status').textContent='Error: '+e.message;$('results').classList.add('hidden')}finally{$('generate').disabled=false}};
$('clear').onclick=()=>{document.querySelectorAll('input,textarea').forEach(x=>x.value='');$('toolType').selectedIndex=0;$('skillLevel').selectedIndex=0;$('results').classList.add('hidden');$('status').className='status';$('status').textContent='Ready.'};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('raw').textContent);$('copy').textContent='Copied ✓';setTimeout(()=>$('copy').textContent='Copy Raw JSON',1500)}catch{$('copy').textContent='Copy failed'}};
</script>
</body>
</html>
