<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CAPTIVATE AI — Gaming Tools</title>
<style>
:root{--bg:#080b12;--panel:#111827;--panel2:#0d111a;--border:#263044;--text:#f8fafc;--muted:#9ca3af;--primary:#8b5cf6;--primary2:#a78bfa;--success:#22c55e;--danger:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:auto;padding:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}
.brand{font-weight:800;letter-spacing:.4px}
.brand span{color:var(--primary2)}
.back{color:var(--muted);text-decoration:none;font-size:14px}
.hero{background:linear-gradient(145deg,#151126,#111827);border:1px solid var(--border);border-radius:20px;padding:25px;margin-bottom:18px}
.badge{display:inline-block;padding:5px 10px;border:1px solid #4c3b78;border-radius:999px;color:var(--primary2);font-size:12px;font-weight:700}
.hero h1{font-size:30px;margin:12px 0 6px}
.hero p{margin:0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#dbe3f0}
input,select,textarea{width:100%;border:1px solid var(--border);background:#0a0f18;color:var(--text);border-radius:11px;padding:12px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
textarea{min-height:92px;resize:vertical}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{border:0;border-radius:11px;padding:12px 17px;font-weight:800;cursor:pointer;background:var(--primary);color:white}
button.secondary{background:#20283a}
button:disabled{opacity:.55;cursor:not-allowed}
.status{margin-top:13px;padding:11px 13px;border-radius:10px;background:#0b1220;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.status.ok{color:#86efac;border:1px solid #14532d}
.status.err{color:#fca5a5;border:1px solid #7f1d1d}
.hidden{display:none}
.result-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.result-title{font-size:24px;margin:0}
.pill{font-size:12px;padding:5px 9px;border-radius:999px;background:#1b1630;color:var(--primary2);border:1px solid #3c2c64}
.summary{color:#d5dbe6;white-space:pre-wrap}
.section{margin-top:20px}
.section h3{font-size:16px;margin:0 0 10px;color:var(--primary2)}
.list{margin:0;padding-left:20px}
.list li{margin:7px 0}
.mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{border:1px solid var(--border);background:var(--panel2);border-radius:12px;padding:12px;overflow-wrap:anywhere}
.mini b{display:block;color:#e5e7eb;font-size:13px;margin-bottom:4px}
.mini span{color:var(--muted);font-size:13px}
.raw{background:#070a10;border:1px solid var(--border);padding:14px;border-radius:12px;white-space:pre-wrap;overflow:auto;font-size:12px;color:#cbd5e1;max-height:430px}
.empty{color:var(--muted);font-size:13px}
.footer{text-align:center;color:#6b7280;font-size:12px;padding:10px}
.loader{display:inline-block;width:12px;height:12px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.wrap{padding:14px}.grid,.mini-grid{grid-template-columns:1fr}.hero h1{font-size:25px}.card{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">CAPTIVATE <span>AI</span></div>
    <a class="back" href="index.html">← Back to Workspace</a>
  </div>

  <section class="hero">
    <span class="badge">GAMING TOOLS • v8.2</span>
    <h1>Gaming Tools</h1>
    <p>Build practical gaming strategies, loadouts, settings, practice plans and troubleshooting guides.</p>
  </section>

  <section class="card">
    <div class="grid">
      <div><label for="game">Game *</label><input id="game" placeholder="e.g. Call of Duty Mobile" required></div>
      <div><label for="toolType">Tool Type</label>
        <select id="toolType">
          <option>Strategy Planner</option>
          <option>Aim/Skill Trainer</option>
          <option>Loadout Builder</option>
          <option>Settings Optimizer</option>
          <option>Beginner Coach</option>
          <option>Rank/Progression Planner</option>
          <option>Troubleshooting Assistant</option>
          <option>Challenge Generator</option>
          <option>Gaming Session Planner</option>
          <option>Custom Gaming Tool</option>
        </select>
      </div>
      <div><label for="platform">Platform</label><input id="platform" placeholder="Mobile, PC, PlayStation, Xbox..."></div>
      <div><label for="mode">Mode</label><input id="mode" placeholder="Ranked, Multiplayer, Battle Royale..."></div>
      <div><label for="skillLevel">Skill Level</label>
        <select id="skillLevel">
          <option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>Competitive</option>
        </select>
      </div>
      <div><label for="character">Character / Role</label><input id="character" placeholder="Optional character, class or role"></div>
      <div class="full"><label for="goal">Goal / Objective</label><textarea id="goal" placeholder="What do you want the gaming tool to help you achieve?"></textarea></div>
      <div><label for="playstyle">Playstyle</label><input id="playstyle" placeholder="Aggressive, defensive, support, balanced..."></div>
      <div><label for="loadout">Current Loadout</label><textarea id="loadout" placeholder="Weapons, perks, equipment, character setup..."></textarea></div>
      <div><label for="settings">Current Settings</label><textarea id="settings" placeholder="Sensitivity, graphics, controls, keybinds..."></textarea></div>
      <div><label for="issue">Problem / Challenge</label><textarea id="issue" placeholder="Describe what is going wrong, if any."></textarea></div>
      <div class="full"><label for="extra">Extra Instructions</label><textarea id="extra" placeholder="Any specific preferences or constraints..."></textarea></div>
    </div>
    <div class="actions">
      <button id="generate" type="button">🎮 Generate Gaming Tool</button>
      <button class="secondary" id="clear" type="button">Clear</button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">Ready.</div>
  </section>

  <section id="results" class="card hidden">
    <div class="result-head">
      <div><h2 id="resultTitle" class="result-title">Gaming Tool</h2><p id="resultSummary" class="summary"></p></div>
      <span id="resultPill" class="pill">Completed</span>
    </div>
    <div id="dynamic"></div>
    <div class="section">
      <h3>Raw JSON</h3>
      <pre id="raw" class="raw"></pre>
      <div class="actions"><button class="secondary" id="copy" type="button">Copy Raw JSON</button></div>
    </div>
  </section>
  <div class="footer">CAPTIVATE AI • Gaming Tools • Cloudflare Workers AI</div>
</div>

<script>
'use strict';

const API_URL = 'https://captivate-ai-api.sirwhitethepolymath.workers.dev';
const $ = id => document.getElementById(id);

function text(value) {
  if (value === undefined || value === null) return '';
  if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') return String(value);
  return '';
}

function arr(value) {
  return Array.isArray(value) ? value : (value == null || value === '' ? [] : [value]);
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[character]));
}

function section(title, content) {
  if (!content) return '';
  return `<div class="section"><h3>${escapeHtml(title)}</h3>${content}</div>`;
}

function list(items) {
  const values = arr(items).map(text).filter(Boolean);
  return values.length
    ? `<ul class="list">${values.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`
    : '<div class="empty">No items returned.</div>';
}

function objectCards(items, fields) {
  const values = arr(items).filter(item => item && typeof item === 'object' && !Array.isArray(item));
  if (!values.length) return '<div class="empty">No items returned.</div>';

  return `<div class="mini-grid">${values.map(object => {
    const content = fields.map(([key, label]) => {
      const value = text(object[key]);
      return value ? `<b>${escapeHtml(label)}</b><span>${escapeHtml(value)}</span>` : '';
    }).join('');
    return `<div class="mini">${content || '<span>Details unavailable.</span>'}</div>`;
  }).join('')}</div>`;
}

function normalizeTool(data) {
  let tool = data?.tool || data?.output || data?.result || data;

  if (typeof tool === 'string') {
    try {
      tool = JSON.parse(tool);
    } catch {
      return { title: 'Gaming Tool', summary: tool };
    }
  }

  return tool && typeof tool === 'object' ? tool : {};
}

function renderTool(data) {
  const tool = normalizeTool(data);

  $('resultTitle').textContent = text(tool.title) || 'Gaming Tool';
  $('resultSummary').textContent = text(tool.summary) || 'Your structured gaming tool is ready.';

  let html = '';
  html += section('Quick Actions', list(tool.quickActions));
  html += section('Recommendations', list(tool.recommendations));
  html += section('Steps', list(tool.steps));
  html += section('Settings', objectCards(tool.settings, [['name','Setting'],['value','Value'],['reason','Reason']]));
  html += section('Loadout', objectCards(tool.loadout, [['slot','Slot'],['choice','Choice'],['reason','Reason'],['alternative','Alternative']]));
  html += section('Practice Plan', objectCards(tool.practice, [['exercise','Exercise'],['duration','Duration'],['goal','Goal']]));
  html += section('Troubleshooting', objectCards(tool.troubleshooting, [['problem','Problem'],['cause','Cause'],['fix','Fix']]));
  html += section('Checklist', list(tool.checklist));
  html += section('Next Steps', list(tool.nextSteps));

  // Correctly close the section/list/map calls.
  const notes = arr(tool.notes);
  const assumptions = arr(tool.assumptions).map(item => 'Assumption: ' + text(item));
  html += section('Notes & Assumptions', list([...notes, ...assumptions]));

  $('dynamic').innerHTML = html || '<div class="empty">The AI returned no structured sections.</div>';

  const raw = JSON.stringify(data, null, 2);
  $('raw').textContent = raw;
  $('results').classList.remove('hidden');
  return raw;
}

function value(id) {
  return $(id).value.trim();
}

$('generate').addEventListener('click', async () => {
  const game = value('game');

  if (!game) {
    $('status').className = 'status err';
    $('status').textContent = 'Please enter a game name.';
    $('game').focus();
    return;
  }

  const payload = {
    type: 'gaming-tools',
    game,
    toolType: value('toolType'),
    platform: value('platform'),
    mode: value('mode'),
    skillLevel: value('skillLevel'),
    goal: value('goal'),
    character: value('character'),
    playstyle: value('playstyle'),
    loadout: value('loadout'),
    settings: value('settings'),
    issue: value('issue'),
    extra: value('extra')
  };

  $('generate').disabled = true;
  $('status').className = 'status';
  $('status').innerHTML = '<span class="loader"></span>Generating gaming tool...';
  $('results').classList.add('hidden');

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok || data.success === false || data.error) {
      throw new Error(data.error || data.message || `Request failed (${response.status}).`);
    }

    renderTool(data);
    $('resultPill').textContent = `Completed • v${data.version || '8.2'}`;
    $('status').className = 'status ok';
    $('status').textContent = 'Gaming tool generated successfully.';
    $('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (error) {
    $('status').className = 'status err';
    $('status').textContent = 'Error: ' + (error.message || 'Unable to generate the gaming tool.');
  } finally {
    $('generate').disabled = false;
  }
});

$('clear').addEventListener('click', () => {
  document.querySelectorAll('input, textarea').forEach(element => element.value = '');
  $('toolType').selectedIndex = 0;
  $('skillLevel').selectedIndex = 0;
  $('results').classList.add('hidden');
  $('status').className = 'status';
  $('status').textContent = 'Ready.';
});

$('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText($('raw').textContent);
    $('copy').textContent = 'Copied ✓';
  } catch {
    $('copy').textContent = 'Copy failed';
  }
  setTimeout(() => $('copy').textContent = 'Copy Raw JSON', 1500);
});
</script>
</body>
</html>
